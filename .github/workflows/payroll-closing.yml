name: SAGAS folha - conferencia
on:
  push:
    branches: [main]
    paths:
      - 'sagas-payroll-closing69.js'
      - 'sagas-payroll-provisions42.js'
      - 'sagas-payroll-provisions43.js'
      - 'sagas-payroll-provisions42-ui.js'
      - 'sagas-payroll-provisions43-ui.js'
      - 'sagas-payroll-thirteenth70.js'
      - 'sagas-payroll-thirteenth70-ui.js'
      - 'sagas-payroll-thirteenth71.js'
      - 'sagas-payroll-thirteenth71-ui.js'
      - 'sagas-payroll-thirteenth111.js'
      - 'sagas-payroll-thirteenth111-ui.js'
      - 'sagas-payroll-thirteenth112.js'
      - 'sagas-payroll-thirteenth112-ui.js'
      - 'index.html'
      - 'SAGAS_worker.js'
      - 'sagas-payroll-vacation67.js'
      - 'tests/payroll-closing-v107.test.mjs'
      - 'tests/payroll-provisions-v108.test.mjs'
      - 'tests/payroll-thirteenth-v109.test.mjs'
      - 'tests/payroll-thirteenth-runs-v110.test.mjs'
      - 'tests/payroll-thirteenth-integration-v111.test.mjs'
      - 'tests/payroll-thirteenth-settlement-v112.test.mjs'
      - '.github/workflows/payroll-closing.yml'
  workflow_dispatch:
jobs:
  monthly-audit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe do modulo
        run: |
          node --check sagas-payroll-closing69.js
          node --check sagas-payroll-provisions42.js
          node --check sagas-payroll-provisions43.js
          node --check sagas-payroll-provisions42-ui.js
          node --check sagas-payroll-provisions43-ui.js
          node --check SAGAS_worker.js
          node --check sagas-payroll-thirteenth70.js
          node --check sagas-payroll-thirteenth70-ui.js
          node --check sagas-payroll-thirteenth71.js
          node --check sagas-payroll-thirteenth71-ui.js
          node --check sagas-payroll-thirteenth111.js
          node --check sagas-payroll-thirteenth111-ui.js
          node --check sagas-payroll-thirteenth112.js
          node --check sagas-payroll-thirteenth112-ui.js
      - name: Executar testes do fechamento
        run: node --test tests/payroll-closing-v107.test.mjs tests/payroll-provisions-v108.test.mjs tests/payroll-thirteenth-v109.test.mjs tests/payroll-thirteenth-runs-v110.test.mjs tests/payroll-thirteenth-integration-v111.test.mjs tests/payroll-thirteenth-settlement-v112.test.mjs
