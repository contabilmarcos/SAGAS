name: SAGAS - Publicar Worker no Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'SAGAS_worker.js'
      - 'sagas-payroll-employer120.js'
      - 'sagas-payroll-vacation121.js'
      - 'sagas-payroll-termination122.js'
      - 'sagas-payroll-termination123.js'
      - 'sagas-payroll-termination123-audit.js'
      - 'sagas-payroll-live-audit124.js'
      - 'sagas-payroll-reopen125.js'
      - 'sagas-payroll-designer127.js'
      - 'sagas-payroll-sql128.js'
      - 'tests/payroll-sql-v128.test.mjs'
      - 'sagas-payroll-formulas129.js'
      - 'sagas-payroll-provision-catalog132.js'
      - 'sagas-payroll-provision-catalog132-ui.js'
      - 'tests/payroll-provision-catalog-v132.test.mjs'
      - 'sagas-payroll-engine133.js'
      - 'sagas-payroll-engine134.js'
      - 'sagas-payroll-projection135.js'
      - 'sagas-payroll-ledger136.js'
      - 'sagas-payroll-monthly137.js'
      - 'sagas-payroll-basic-history138.js'
      - 'sagas-payroll-engine133-ui.js'
      - 'tests/payroll-engine-v133.test.mjs'
      - 'tests/payroll-engine-v134.test.mjs'
      - 'tests/payroll-projection-v135.test.mjs'
      - 'tests/payroll-ledger-v136.test.mjs'
      - 'tests/payroll-monthly-v137.test.mjs'
      - 'tests/payroll-monthly-worker-v137.test.mjs'
      - 'tests/payroll-basic-history-v138.test.mjs'
      - 'tests/payroll-monthly-error-v139.test.mjs'
      - 'sagas-payroll-formulas129-ui.js'
      - 'tests/payroll-formulas-v129.test.mjs'
      - 'tests/payroll-models-v130.test.mjs'
      - 'tests/payroll-event-save-ui-v131.test.mjs'
      - 'sagas-payroll-designer127-ui.js'
      - 'tests/payroll-designer-v127.test.mjs'
      - 'tests/payroll-reopen-v125.test.mjs'
      - 'sagas-payroll-thirteenth112.js'
      - 'sagas-payroll-closing69.js'
      - 'tests/payroll-employer-v120.test.mjs'
      - 'tests/payroll-vacation-v121.test.mjs'
      - 'tests/payroll-termination-v115.test.mjs'
      - 'tests/payroll-termination-v122.test.mjs'
      - 'tests/payroll-termination-v123.test.mjs'
      - 'tests/payroll-termination-v123-audit.test.mjs'
      - 'tests/payroll-live-audit-v124.test.mjs'
      - 'sagas-payroll37.js'
      - 'sagas-payroll38.js'
      - 'sagas-payroll39.js'
      - 'sagas-payroll-ledger126.js'
      - 'sagas-payroll38-ui.js'
      - 'tests/payroll-ledger-v126.test.mjs'
      - 'sagas-payroll-employer40.js'
      - 'sagas-payroll-provisions42.js'
      - 'sagas-payroll-provisions42-ui.js'
      - 'sagas-payroll-provisions43.js'
      - 'sagas-payroll-provisions43-ui.js'
      - 'sagas-payroll-provisions44.js'
      - 'sagas-payroll-provisions44-ui.js'
      - 'sagas-payroll-provisions45.js'
      - 'sagas-payroll-provisions45-ui.js'
      - 'sagas-payroll-admission46.js'
      - 'sagas-payroll-admission46-ui.js'
      - 'sagas-payroll-salary47.js'
      - 'sagas-payroll-salary47-ui.js'
      - 'sagas-payroll-absence48.js'
      - 'sagas-payroll-absence48-ui.js'
      - 'sagas-payroll-leave49.js'
      - 'sagas-payroll-leave49-ui.js'
      - 'tests/payroll-leave49.test.mjs'
      - 'tests/payroll-absence48.test.mjs'
      - 'tests/payroll-salary47.test.mjs'
      - 'tests/payroll-admission46.test.mjs'
      - '.github/workflows/deploy-sagas-worker.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verificar sem publicar ou publicar no Cloudflare'
        type: choice
        required: true
        default: verificar
        options:
          - verificar
          - publicar

permissions:
  contents: read

concurrency:
  group: sagas-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Validar e publicar sagas-api
    # Mantém produção protegida até a ativação explícita pelo dono do repositório.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SAGAS_CLOUDFLARE_AUTO_DEPLOY == 'enabled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código do SAGAS
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar sintaxe do Worker
        run: node --check SAGAS_worker.js

      - name: Testar salário proporcional (RM)
        run: node --test tests/payroll-admission46.test.mjs

      - name: Testar mudanças salariais dentro do mês
        run: node --test tests/payroll-salary47.test.mjs

      - name: Testar faltas, atrasos e DSR confirmados
        run: node --test tests/payroll-absence48.test.mjs

      - name: Testar licenças e afastamentos
        run: node --test tests/payroll-leave49.test.mjs

      - name: Verificar sintaxe dos módulos integrados da folha
        run: |
          node --check sagas-payroll-employer120.js
          node --check sagas-payroll-vacation121.js
          node --check sagas-payroll-termination122.js
          node --check sagas-payroll-termination123.js
          node --check sagas-payroll-termination123-audit.js
          node --check sagas-payroll-live-audit124.js
          node --check sagas-payroll-reopen125.js
          node --check sagas-payroll-designer127.js
          node --check sagas-payroll-sql128.js
          node --check sagas-payroll-formulas129.js
          node --check sagas-payroll-provision-catalog132.js
          node --check sagas-payroll-provision-catalog132-ui.js
          node --check sagas-payroll-engine133.js
          node --check sagas-payroll-engine134.js
          node --check sagas-payroll-projection135.js
          node --check sagas-payroll-ledger136.js
          node --check sagas-payroll-monthly137.js
          node --check sagas-payroll-basic-history138.js
          node --check sagas-payroll-engine133-ui.js
          node --check sagas-payroll-formulas129-ui.js
          node --check sagas-payroll-designer127-ui.js
          node --check sagas-payroll39.js
          node --check sagas-payroll-ledger126.js
          node --check sagas-payroll38-ui.js

      - name: Testar v115 e as integrações de folha v120 a v124 antes do deploy
        run: |
          node --test \
            tests/payroll-termination-v115.test.mjs \
            tests/payroll-employer-v120.test.mjs \
            tests/payroll-vacation-v121.test.mjs \
            tests/payroll-termination-v122.test.mjs \
            tests/payroll-termination-v123.test.mjs \
            tests/payroll-termination-v123-audit.test.mjs \
            tests/payroll-live-audit-v124.test.mjs \
            tests/payroll-reopen-v125.test.mjs \
            tests/payroll-ledger-v126.test.mjs \
            tests/payroll-designer-v127.test.mjs \
            tests/payroll-sql-v128.test.mjs \
            tests/payroll-formulas-v129.test.mjs \
            tests/payroll-models-v130.test.mjs \
            tests/payroll-event-save-ui-v131.test.mjs \
            tests/payroll-provision-catalog-v132.test.mjs \
            tests/payroll-engine-v133.test.mjs \
            tests/payroll-engine-v134.test.mjs \
            tests/payroll-projection-v135.test.mjs \
            tests/payroll-ledger-v136.test.mjs \
            tests/payroll-monthly-v137.test.mjs \
            tests/payroll-monthly-worker-v137.test.mjs \
            tests/payroll-basic-history-v138.test.mjs \
            tests/payroll-monthly-error-v139.test.mjs

      - name: Validar configuração e gerar Wrangler temporário
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          function required(name) {
            const value = String(process.env[name] || '').trim();
            if (!value) throw new Error('Configuração ausente: ' + name + '. Cadastre em Settings > Secrets and variables > Actions.');
            return value;
          }

          const account = required('CLOUDFLARE_ACCOUNT_ID');
          required('CLOUDFLARE_API_TOKEN');
          const databaseId = required('CLOUDFLARE_D1_DATABASE_ID');
          const databaseName = required('CLOUDFLARE_D1_DATABASE_NAME');
          if (!/^[0-9a-f]{32}$/i.test(account)) throw new Error('CLOUDFLARE_ACCOUNT_ID inválido.');
          if (!/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(databaseId)) throw new Error('CLOUDFLARE_D1_DATABASE_ID deve ser UUID do banco de produção existente.');
          const config = {
            name: 'sagas-api',
            main: './SAGAS_worker.js',
            compatibility_date: '2025-01-01',
            workers_dev: true,
            keep_vars: true,
            d1_databases: [{
              binding: 'DB',
              database_name: databaseName,
              database_id: databaseId
            }]
          };
          writeFileSync('wrangler.sagas.deploy.json', JSON.stringify(config, null, 2) + '\n');
          console.log('Configuração validada. Destino: Worker sagas-api; vínculo D1: DB. Não foram exibidas credenciais.');
          NODE

      - name: Conferir Worker e banco D1 de produção sem modificar nada
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const expected = String(process.env.CLOUDFLARE_D1_DATABASE_ID || '').toLowerCase();
          const endpoint = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/workers/scripts/sagas-api/settings';
          const response = await fetch(endpoint, { headers: { Authorization: 'Bearer ' + token } });
          if (!response.ok) throw Error('Não foi possível consultar a configuração do Worker sagas-api. HTTP ' + response.status + '. Verifique conta e permissão Workers.');
          const body = await response.json();
          if (!body.success || !body.result || !Array.isArray(body.result.bindings)) {
            throw Error('A Cloudflare não retornou os vínculos atuais do Worker.');
          }
          const d1 = body.result.bindings.filter(b => b.type === 'd1');
          if (d1.length !== 1 || d1[0].name !== 'DB') {
            throw Error('O Worker existente não possui exatamente um vínculo D1 com o nome DB. Deploy bloqueado.');
          }
          const actual = String(d1[0].database_id || d1[0].id || '').toLowerCase();
          if (!actual || actual !== expected) {
            throw Error('O UUID do banco D1 no GitHub difere do banco DB vinculado ao Worker de produção. Deploy bloqueado.');
          }
          const unsupported = body.result.bindings.filter(b => !['d1', 'plain_text', 'secret_text', 'secret_key'].includes(b.type));
          if (unsupported.length) {
            throw Error('O Worker contém vínculos adicionais não configurados neste workflow (' + unsupported.map(b => b.type).join(', ') + '). Deploy bloqueado para preservar os recursos.');
          }
          const configuration = JSON.parse(readFileSync('wrangler.sagas.deploy.json', 'utf8'));
          if (body.result.compatibility_date) {
            configuration.compatibility_date = body.result.compatibility_date;
          }
          if (Array.isArray(body.result.compatibility_flags)) {
            configuration.compatibility_flags = body.result.compatibility_flags;
          }
          writeFileSync('wrangler.sagas.deploy.json', JSON.stringify(configuration, null, 2) + '\n');
          console.log('Pré-verificação passou: Worker existente, vínculo DB e UUID D1 conferidos. Configuração de compatibilidade preservada.');
          NODE


      - name: Publicar no Cloudflare
        if: ${{ (github.event_name == 'push' && vars.SAGAS_CLOUDFLARE_AUTO_DEPLOY == 'enabled') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publicar') }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.sagas.deploy.json --keep-vars
