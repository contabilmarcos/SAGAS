name: SAGAS - Testar configuracao da folha
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/payroll-designer-ci.yml'
      - 'sagas-payroll-designer127.js'
      - 'sagas-payroll39.js'
      - 'sagas-payroll-sql128.js'
      - 'tests/payroll-sql-v128.test.mjs'
      - 'sagas-payroll-formulas129.js'
      - 'sagas-payroll-provision-catalog132.js'
      - 'sagas-payroll-provision-catalog132-ui.js'
      - 'tests/payroll-provision-catalog-v132.test.mjs'
      - 'sagas-payroll-engine133.js'
      - 'sagas-payroll-engine134.js'
      - 'sagas-payroll-projection135.js'
      - 'sagas-payroll-ledger136.js'
      - 'sagas-payroll-monthly137.js'
      - 'sagas-payroll-basic-history138.js'
      - 'sagas-payroll-simple141.js'
      - 'sagas-payroll-simple141-ui.js'
      - 'sagas-payroll-engine133-ui.js'
      - 'tests/payroll-engine-v133.test.mjs'
      - 'tests/payroll-engine-v134.test.mjs'
      - 'tests/payroll-projection-v135.test.mjs'
      - 'tests/payroll-ledger-v136.test.mjs'
      - 'tests/payroll-monthly-v137.test.mjs'
      - 'tests/payroll-monthly-worker-v137.test.mjs'
      - 'tests/payroll-basic-history-v138.test.mjs'
      - 'tests/payroll-monthly-error-v139.test.mjs'
      - 'tests/payroll-simple-v141.test.mjs'
      - 'sagas-payroll-formulas129-ui.js'
      - 'tests/payroll-formulas-v129.test.mjs'
      - 'tests/payroll-models-v130.test.mjs'
      - 'tests/payroll-event-save-ui-v131.test.mjs'
      - 'sagas-payroll-designer127-ui.js'
      - 'tests/payroll-designer-v127.test.mjs'
      - 'index.html'
      - 'SAGAS_worker.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  designer:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe dos modulos e Worker
        run: |
          node --check sagas-payroll-designer127.js
          node --check sagas-payroll-sql128.js
          node --check sagas-payroll-formulas129.js
          node --check sagas-payroll-provision-catalog132.js
          node --check sagas-payroll-provision-catalog132-ui.js
          node --check sagas-payroll-engine133.js
          node --check sagas-payroll-engine134.js
          node --check sagas-payroll-projection135.js
          node --check sagas-payroll-ledger136.js
          node --check sagas-payroll-monthly137.js
          node --check sagas-payroll-basic-history138.js
          node --check sagas-payroll-simple141.js
          node --check sagas-payroll-simple141-ui.js
          node --check sagas-payroll-engine133-ui.js
          node --check sagas-payroll-formulas129-ui.js
          node --check sagas-payroll-designer127-ui.js
          node --check SAGAS_worker.js
      - name: Testar regra de eventos parametrizados (sem consultar D1 real)
        run: node --test tests/payroll-designer-v127.test.mjs tests/payroll-sql-v128.test.mjs tests/payroll-formulas-v129.test.mjs tests/payroll-models-v130.test.mjs tests/payroll-event-save-ui-v131.test.mjs tests/payroll-provision-catalog-v132.test.mjs tests/payroll-engine-v133.test.mjs tests/payroll-engine-v134.test.mjs tests/payroll-projection-v135.test.mjs tests/payroll-ledger-v136.test.mjs tests/payroll-monthly-v137.test.mjs tests/payroll-monthly-worker-v137.test.mjs tests/payroll-basic-history-v138.test.mjs tests/payroll-monthly-error-v139.test.mjs tests/payroll-simple-v141.test.mjs
      - name: Validar script inline do index
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {Script} from 'node:vm';
          const html=readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          for(const x of scripts){if(x[1].trim())new Script(x[1]);}
          if(!html.includes('sagas-payroll-designer127-ui.js'))throw Error('Cadastro novo nao incluido.');
          if(!html.includes('sagas-payroll-provision-catalog132-ui.js'))throw Error('Provisoes nao incluidas.');
          if(!html.includes('sagas-payroll-engine133-ui.js'))throw Error('Conferencia nao incluida.');
          console.log('Scripts inline verificados: '+scripts.length);
          NODE
