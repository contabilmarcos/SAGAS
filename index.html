<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAGAS</title>
  <style>
:root{--blue:#1557d6;--blue2:#1048b4;--blueSoft:#edf3ff;--bg:#f5f7fb;--surface:#fff;--line:#dfe5ee;--line2:#edf1f5;--text:#172033;--muted:#697386;--danger:#c53d32;--success:#207a50;--warn:#956200;--side:238px;--shadow:0 18px 55px rgba(20,28,45,.16)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(135deg,rgba(21,87,214,.07),transparent 45%),#f7f9fc}.login-wrap{width:min(430px,100%)}.brand{display:flex;justify-content:center;align-items:center;gap:13px;margin-bottom:22px}.brand h1{font-size:24px;margin:0}.brand p{font-size:13px;color:var(--muted);margin:3px 0}.brand-icon{width:46px;height:46px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:23px;font-weight:800;box-shadow:0 8px 22px rgba(21,87,214,.22)}.brand-icon.small{width:35px;height:35px;border-radius:9px;font-size:17px;box-shadow:none}.login-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow)}.login-card h2{margin:0}.login-card>p{font-size:14px;margin:6px 0 22px}.stack{display:flex;flex-direction:column;gap:14px}.login-links{display:flex;justify-content:space-between;margin-top:16px}.link-btn{border:0;background:transparent;color:var(--blue);font-size:12px}.api-status{text-align:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line2);font-size:11px;color:var(--muted)}
.app{display:flex;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}.sidebar-brand{height:72px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line)}.sidebar-brand b{display:block;font-size:14px}.sidebar-brand small{display:block;color:var(--muted);margin-top:2px}.sidebar nav{padding:14px 10px;display:flex;flex-direction:column;gap:3px}.nav{border:0;background:transparent;width:100%;padding:10px 12px;border-radius:8px;text-align:left;color:#40506a;font-size:13px;display:flex;gap:10px;align-items:center}.nav:hover{background:#f5f8fd}.nav.active{background:var(--blueSoft);color:var(--blue);font-weight:650}.nav.secondary{color:var(--muted)}.sidebar-bottom{margin-top:auto;padding:10px;border-top:1px solid var(--line)}.main{margin-left:var(--side);width:calc(100% - var(--side))}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:30}.title-wrap{display:flex;align-items:center;gap:10px}.title-wrap h2{font-size:18px;margin:0}.title-wrap p{font-size:12px;margin:4px 0 0;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:18px}.company{display:flex;flex-direction:column;gap:3px}.company span{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}.company select{min-width:210px}.user{display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--blueSoft);color:var(--blue);font-weight:750}.user-info b{display:block;font-size:12px}.user-info small{display:block;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis}.icon-btn{border:0;background:transparent;padding:6px 8px;border-radius:7px;color:var(--muted);font-size:18px}.icon-btn:hover{background:#f1f4f8;color:var(--text)}.mobile{display:none}.content{padding:22px 26px 40px}
.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.search{width:320px;max-width:55vw}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{text-align:left;background:#f8fafc;padding:11px 12px;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.35px;color:#536073;white-space:nowrap}.table td{padding:11px 12px;border-bottom:1px solid var(--line2);font-size:12px}.table tbody tr:hover{background:#fbfcfe}.table tbody tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:50px 20px}.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:5px}.code{font-family:Consolas,monospace;color:#34435a}.actions{display:flex;justify-content:flex-end;gap:4px}
.btn{border:1px solid transparent;border-radius:8px;padding:9px 13px;font-weight:650;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue2)}.btn.secondary{background:#fff;border-color:var(--line);color:#354055}.btn.danger{background:#fff;border-color:#efc4c0;color:var(--danger)}.btn.success{background:#edf8f2;border-color:#c8e8d7;color:var(--success)}.btn.sm{padding:6px 9px;font-size:11px}.btn.block{width:100%;padding:11px}
.field{display:flex;flex-direction:column;gap:6px}.field span{font-size:11px;font-weight:650;color:#4a566b}.field input,.field select,.field textarea,.company select,.search{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;outline:0;color:var(--text)}.field textarea{min-height:84px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:#8aacf1;box-shadow:0 0 0 3px rgba(21,87,214,.08)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field.full{grid-column:1/-1}.check{display:flex;align-items:center;gap:7px;font-size:12px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2)}
.badge{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:700}.badge.blue{background:var(--blueSoft);color:var(--blue)}.badge.green{background:#eaf7f0;color:var(--success)}.badge.red{background:#fff0ef;color:var(--danger)}.badge.gray{background:#f0f2f5;color:#5d6675}.badge.yellow{background:#fff5d9;color:var(--warn)}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.40);display:grid;place-items:center;padding:24px;z-index:100}.modal-box{width:min(680px,96vw);max-height:92vh;background:#fff;border-radius:12px;box-shadow:0 24px 80px rgba(10,20,40,.3);display:flex;flex-direction:column;overflow:hidden}.modal-box.large{width:min(1080px,98vw)}.modal-box>header{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-box h3{margin:0;font-size:17px}.modal-box header p{margin:4px 0 0;color:var(--muted);font-size:11px}.modal-body{padding:20px;overflow:auto}.section-title{font-size:12px;font-weight:750;margin:17px 0 8px}.lines{border:1px solid var(--line);border-radius:8px;overflow:auto}.lines table{width:100%;min-width:900px;border-collapse:collapse}.lines th{background:#f8fafc;font-size:9px;text-transform:uppercase;text-align:left;color:#59667a;padding:8px;border-bottom:1px solid var(--line)}.lines td{padding:6px;border-bottom:1px solid var(--line2)}.lines input,.lines select{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px;font-size:11px}.remove-line{border:0;background:transparent;color:var(--danger);font-size:16px}.totals{display:flex;justify-content:flex-end;gap:22px;font-size:12px;padding:12px 2px}.balance-ok{color:var(--success)}.balance-bad{color:var(--danger)}
#toasts{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px}.toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;box-shadow:var(--shadow);padding:12px 14px;min-width:270px;max-width:430px;font-size:12px}.toast.error{border-left-color:var(--danger)}.toast.success{border-left-color:var(--success)}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.mobile{display:inline-flex}.topbar{padding:0 14px}.title-wrap p,.user-info,.company span{display:none}.company select{min-width:130px;max-width:155px}.content{padding:16px}}@media(max-width:650px){.grid,.grid.three{grid-template-columns:1fr}.toolbar{flex-direction:column}.search{width:100%;max-width:none}}

</style>
</head>
<body>
  <div id="toasts"></div>

  <section id="loginScreen" class="login-screen">
    <div class="login-wrap">
      <div class="brand"><div class="brand-icon">G</div><div><h1>SAGAS</h1><p>Sistema de Administração e Gestão</p></div></div>
      <div class="login-card">
        <h2>Entrar</h2><p class="muted">Acesse o ambiente da sua empresa.</p>
        <form id="loginForm" class="stack">
          <label class="field"><span>E-mail</span><input id="loginEmail" type="email" autocomplete="username" required></label>
          <label class="field"><span>Senha</span><input id="loginPassword" type="password" autocomplete="current-password" required></label>
          <button class="btn primary block">Entrar</button>
        </form>
        <div class="login-links"><button id="apiConfigLogin" class="link-btn">Configurar API</button><button id="bootstrapBtn" class="link-btn">Primeiro acesso</button></div>
        <div id="apiStatus" class="api-status">API não configurada</div>
      </div>
    </div>
  </section>

  <div id="app" class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand"><div class="brand-icon small">G</div><div><b>SAGAS</b><small>Contábil</small></div></div>
      <nav>
        <button class="nav active" data-page="accounts">▦ <span>Plano de Contas</span></button>
        <button class="nav" data-page="cost-centers">◎ <span>Centros de Custo</span></button>
        <button class="nav" data-page="history">≡ <span>Históricos Padrão</span></button>
        <button class="nav" data-page="periods">□ <span>Períodos Contábeis</span></button>
        <button class="nav" data-page="batches">▤ <span>Lotes</span></button>
        <button class="nav" data-page="entries">⇄ <span>Lançamentos</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button id="changePasswordApp" class="nav secondary">🔒 <span>Alterar senha</span></button>
        <button id="apiConfigApp" class="nav secondary">⚙ <span>Configurar API</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-wrap"><button id="menuBtn" class="icon-btn mobile">☰</button><div><h2 id="pageTitle">Plano de Contas</h2><p id="pageSub">Cadastro e estrutura das contas contábeis</p></div></div>
        <div class="top-actions">
          <label class="company"><span>Empresa</span><select id="companySelect"></select></label>
          <div class="user"><div id="avatar" class="avatar">U</div><div class="user-info"><b id="userName">Usuário</b><small id="userEmail"></small></div><button id="logoutBtn" class="icon-btn" title="Sair">↪</button></div>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div id="modal" class="modal-box">
      <header><div><h3 id="modalTitle"></h3><p id="modalSub"></p></div><button id="modalClose" class="icon-btn">×</button></header>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
const S={api:localStorage.getItem('erp_api')||'',token:localStorage.getItem('erp_token')||'',user:JSON.parse(localStorage.getItem('erp_user')||'null'),companies:JSON.parse(localStorage.getItem('erp_companies')||'[]'),companyId:localStorage.getItem('erp_company')||'',page:'accounts',cache:{}};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const meta={accounts:['Plano de Contas','Cadastro e estrutura das contas contábeis'],'cost-centers':['Centros de Custo','Estrutura gerencial para rateios e análises'],history:['Históricos Padrão','Textos padronizados utilizados nos lançamentos'],periods:['Períodos Contábeis','Controle de abertura e validade dos lançamentos'],batches:['Lotes','Agrupamento e controle dos lançamentos contábeis'],entries:['Lançamentos','Movimentação contábil por débito e crédito']};
function toast(m,t='success'){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),4200)}
function money(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0))}
function dateBR(v){if(!v)return'';const p=String(v).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v}
function save(){localStorage.setItem('erp_token',S.token||'');localStorage.setItem('erp_user',JSON.stringify(S.user));localStorage.setItem('erp_companies',JSON.stringify(S.companies));localStorage.setItem('erp_company',S.companyId||'')}
function clear(){S.token='';S.user=null;S.companies=[];S.companyId='';S.cache={};['erp_token','erp_user','erp_companies','erp_company'].forEach(localStorage.removeItem.bind(localStorage))}
async function api(path,opt={}){if(!S.api)throw Error('Configure a URL da API.');const h={...(opt.headers||{})};let body=opt.body;if(body&&typeof body!=='string'){h['Content-Type']='application/json';body=JSON.stringify(body)}if(S.token)h.Authorization='Bearer '+S.token;if(S.companyId&&opt.company!==false)h['X-Company-Id']=S.companyId;const r=await fetch(S.api.replace(/\/+$/,'')+path,{...opt,headers:h,body});let d={};try{d=await r.json()}catch{}if(!r.ok||d.ok===false){const e=Error(d?.error?.message||`Erro HTTP ${r.status}`);e.status=r.status;throw e}return d}
function openModal(t,sub,html,large=false){$('#modalTitle').textContent=t;$('#modalSub').textContent=sub||'';$('#modalBody').innerHTML=html;$('#modal').classList.toggle('large',large);$('#modalBackdrop').classList.remove('hidden')}
function closeModal(){$('#modalBackdrop').classList.add('hidden')}
function badge(s){const m={OPEN:['Aberto','green'],CLOSED:['Fechado','gray'],LOCKED:['Bloqueado','red'],DRAFT:['Rascunho','yellow'],POSTED:['Contabilizado','green'],VOID:['Anulado','red']};const x=m[s]||[s||'-','gray'];return`<span class="badge ${x[1]}">${esc(x[0])}</span>`}
function empty(cols,t,x){return`<tr><td colspan="${cols}"><div class="empty"><b>${esc(t)}</b>${esc(x)}</div></td></tr>`}
function tablePage({newLabel,onNew,cols,rows,emptyTitle,emptyText,placeholder='Pesquisar...'}){$('#content').innerHTML=`<div class="toolbar"><input id="search" class="search" placeholder="${esc(placeholder)}"><button id="newBtn" class="btn primary">+ ${esc(newLabel)}</button></div><div class="table-wrap"><table class="table"><thead><tr>${cols.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody id="tbody">${rows||empty(cols.length,emptyTitle,emptyText)}</tbody></table></div>`;$('#newBtn').onclick=onNew;$('#search').oninput=e=>{const q=e.target.value.toLowerCase().trim();$$('#tbody tr').forEach(r=>r.style.display=!q||r.innerText.toLowerCase().includes(q)?'':'none')}}
function showLogin(){$('#app').classList.add('hidden');$('#loginScreen').classList.remove('hidden');apiStatus()}
async function showApp(){$('#loginScreen').classList.add('hidden');$('#app').classList.remove('hidden');chrome();await nav(S.page)}
function chrome(){$('#userName').textContent=S.user?.name||'Usuário';$('#userEmail').textContent=S.user?.email||'';$('#avatar').textContent=(S.user?.name||'U').trim()[0].toUpperCase();$('#companySelect').innerHTML=S.companies.map(c=>`<option value="${esc(c.id)}">${esc(c.code)} - ${esc(c.legal_name)}</option>`).join('');$('#companySelect').value=S.companyId}
function apiStatus(){$('#apiStatus').textContent=S.api?'API: '+S.api:'API não configurada'}
async function nav(p){S.page=p;$('#pageTitle').textContent=meta[p][0];$('#pageSub').textContent=meta[p][1];$$('.nav[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#content').innerHTML='<div class="empty"><b>Carregando...</b></div>';try{if(p==='accounts')await renderAccounts();if(p==='cost-centers')await renderCC();if(p==='history')await renderHistory();if(p==='periods')await renderPeriods();if(p==='batches')await renderBatches();if(p==='entries')await renderEntries()}catch(e){$('#content').innerHTML=`<div class="empty"><b>Não foi possível carregar</b>${esc(e.message)}</div>`;if(e.status===401){clear();showLogin()}}}
function accountClass(v){return({ASSET:'Ativo',LIABILITY:'Passivo',EQUITY:'Patrimônio Líquido',REVENUE:'Receita',EXPENSE:'Despesa',RESULT:'Resultado',COMPENSATION:'Compensação',OTHER:'Outras'})[v]||v||'-'}
async function load(k,path,key,force=false){if(!force&&S.cache[k])return S.cache[k];const d=await api(path);return S.cache[k]=d[key]||[]}
const accounts=f=>load('accounts','/api/accounts','accounts',f), ccs=f=>load('ccs','/api/cost-centers','cost_centers',f), histories=f=>load('hist','/api/history-templates','history_templates',f), periods=f=>load('periods','/api/accounting-periods','periods',f), batches=f=>load('batches','/api/journal-batches','batches',f), branches=f=>load('branches','/api/branches','branches',f);
async function renderAccounts(){const a=await accounts(true);tablePage({newLabel:'Nova conta',onNew:()=>accountForm(),cols:['Código','Reduzido','Descrição','Natureza','Tipo','Situação',''],rows:a.length?a.map(x=>`<tr><td class="code">${esc(x.code)}</td><td class="code">${esc(x.reduced_code||'')}</td><td>${esc(x.name)}</td><td>${esc(accountClass(x.account_class))}</td><td>${x.analytic?'<span class="badge blue">Analítica</span>':'<span class="badge gray">Sintética</span>'}</td><td>${x.active?'<span class="badge green">Ativa</span>':'<span class="badge red">Inativa</span>'}</td><td><div class="actions"><button class="btn secondary sm" data-edit="${x.id}">Editar</button></div></td></tr>`).join(''):null,emptyTitle:'Nenhuma conta cadastrada',emptyText:'Cadastre a primeira conta do plano de contas.',placeholder:'Pesquisar por código, reduzido ou descrição...'});$$('[data-edit]').forEach(b=>b.onclick=()=>accountForm(a.find(x=>x.id===b.dataset.edit)))}
async function accountForm(a=null){const list=await accounts();openModal(a?'Editar conta':'Nova conta','',`<form id="f"><div class="grid"><label class="field"><span>Código</span><input name="code" required value="${esc(a?.code||'')}"></label><label class="field"><span>Reduzido</span><input name="reduced_code" value="${esc(a?.reduced_code||'')}"></label><label class="field full"><span>Descrição</span><input name="name" required value="${esc(a?.name||'')}"></label><label class="field full"><span>Conta superior</span><select name="parent_id"><option value="">Sem superior</option>${list.filter(x=>x.id!==a?.id).map(x=>`<option value="${x.id}" ${x.id===a?.parent_id?'selected':''}>${esc(x.code)} - ${esc(x.name)}</option>`).join('')}</select></label><label class="field"><span>Natureza</span><select name="account_class">${['ASSET','LIABILITY','EQUITY','REVENUE','EXPENSE','RESULT','COMPENSATION','OTHER'].map(v=>`<option value="${v}" ${v===(a?.account_class||'OTHER')?'selected':''}>${accountClass(v)}</option>`).join('')}</select></label><label class="field"><span>Natureza do saldo</span><select name="normal_side"><option value="D" ${a?.normal_side!=='C'?'selected':''}>Devedora</option><option value="C" ${a?.normal_side==='C'?'selected':''}>Credora</option></select></label><label class="check"><input name="analytic" type="checkbox" ${a?.analytic!==0?'checked':''}> Analítica</label><label class="check"><input name="active" type="checkbox" ${a?.active!==0?'checked':''}> Ativa</label></div><div class="form-actions"><button type="button" class="btn secondary" data-close>Cancelar</button><button class="btn primary">Salvar</button></div></form>`);$('[data-close]').onclick=closeModal;$('#f').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));b.analytic=e.target.analytic.checked;b.active=e.target.active.checked;b.parent_id=b.parent_id||null;try{await api(a?`/api/accounts/${a.id}`:'/api/accounts',{method:a?'PATCH':'POST',body:b});closeModal();S.cache.accounts=null;toast('Conta salva.');renderAccounts()}catch(x){toast(x.message,'error')}}}
async function renderCC(){const a=await ccs(true);tablePage({newLabel:'Novo centro de custo',onNew:ccForm,cols:['Código','Descrição','Superior','Situação'],rows:a.length?a.map(x=>`<tr><td class="code">${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(a.find(y=>y.id===x.parent_id)?.name||'')}</td><td>${x.active?'<span class="badge green">Ativo</span>':'<span class="badge red">Inativo</span>'}</td></tr>`).join(''):null,emptyTitle:'Nenhum centro de custo',emptyText:'Cadastre a estrutura gerencial para rateios.'})}
async function ccForm(){const a=await ccs();openModal('Novo centro de custo','',`<form id="f"><div class="grid"><label class="field"><span>Código</span><input name="code" required></label><label class="field"><span>Descrição</span><input name="name" required></label><label class="field full"><span>Centro superior</span><select name="parent_id"><option value="">Sem superior</option>${a.map(x=>`<option value="${x.id}">${esc(x.code)} - ${esc(x.name)}</option>`).join('')}</select></label><label class="check"><input name="active" type="checkbox" checked> Ativo</label></div><div class="form-actions"><button type="button" class="btn secondary" data-close>Cancelar</button><button class="btn primary">Salvar</button></div></form>`);$('[data-close]').onclick=closeModal;$('#f').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));b.active=e.target.active.checked;b.parent_id=b.parent_id||null;try{await api('/api/cost-centers',{method:'POST',body:b});closeModal();S.cache.ccs=null;toast('Centro de custo salvo.');renderCC()}catch(x){toast(x.message,'error')}}}
async function renderHistory(){const a=await histories(true);tablePage({newLabel:'Novo histórico',onNew:historyForm,cols:['Código','Descrição','Complemento','Situação'],rows:a.length?a.map(x=>`<tr><td class="code">${esc(x.code)}</td><td>${esc(x.description)}</td><td>${x.complement_required?'<span class="badge blue">Obrigatório</span>':'Opcional'}</td><td>${x.active?'<span class="badge green">Ativo</span>':'<span class="badge red">Inativo</span>'}</td></tr>`).join(''):null,emptyTitle:'Nenhum histórico padrão',emptyText:'Cadastre históricos para padronizar a escrituração.'})}
function historyForm(){openModal('Novo histórico padrão','',`<form id="f"><div class="grid"><label class="field"><span>Código</span><input name="code" required></label><label class="field full"><span>Descrição</span><textarea name="description" required></textarea></label><label class="check"><input name="complement_required" type="checkbox"> Exigir complemento</label><label class="check"><input name="active" type="checkbox" checked> Ativo</label></div><div class="form-actions"><button type="button" class="btn secondary" data-close>Cancelar</button><button class="btn primary">Salvar</button></div></form>`);$('[data-close]').onclick=closeModal;$('#f').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));b.complement_required=e.target.complement_required.checked;b.active=e.target.active.checked;try{await api('/api/history-templates',{method:'POST',body:b});closeModal();S.cache.hist=null;toast('Histórico salvo.');renderHistory()}catch(x){toast(x.message,'error')}}}
async function renderPeriods(){const a=await periods(true);tablePage({newLabel:'Novo período',onNew:periodForm,cols:['Código','Início','Fim','Situação'],rows:a.length?a.map(x=>`<tr><td class="code">${esc(x.code)}</td><td>${dateBR(x.start_date)}</td><td>${dateBR(x.end_date)}</td><td>${badge(x.status)}</td></tr>`).join(''):null,emptyTitle:'Nenhum período contábil',emptyText:'Crie um período antes de abrir lotes.'})}
function periodForm(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),last=String(new Date(y,d.getMonth()+1,0).getDate()).padStart(2,'0');openModal('Novo período contábil','',`<form id="f"><div class="grid"><label class="field"><span>Código</span><input name="code" required value="${y}-${m}"></label><label class="field"><span>Situação</span><select name="status"><option value="OPEN">Aberto</option><option value="CLOSED">Fechado</option><option value="LOCKED">Bloqueado</option></select></label><label class="field"><span>Data inicial</span><input name="start_date" type="date" required value="${y}-${m}-01"></label><label class="field"><span>Data final</span><input name="end_date" type="date" required value="${y}-${m}-${last}"></label></div><div class="form-actions"><button type="button" class="btn secondary" data-close>Cancelar</button><button class="btn primary">Salvar</button></div></form>`);$('[data-close]').onclick=closeModal;$('#f').onsubmit=async e=>{e.preventDefault();try{await api('/api/accounting-periods',{method:'POST',body:Object.fromEntries(new FormData(e.target))});closeModal();S.cache.periods=null;toast('Período criado.');renderPeriods()}catch(x){toast(x.message,'error')}}}
async function renderBatches(){const a=await batches(true),p=await periods();tablePage({newLabel:'Novo lote',onNew:batchForm,cols:['Código','Descrição','Período','Início','Fim','Situação'],rows:a.length?a.map(x=>`<tr><td class="code">${esc(x.code)}</td><td>${esc(x.description)}</td><td>${esc(p.find(y=>y.id===x.period_id)?.code||'')}</td><td>${dateBR(x.start_date)}</td><td>${dateBR(x.end_date)}</td><td>${badge(x.status)}</td></tr>`).join(''):null,emptyTitle:'Nenhum lote contábil',emptyText:'Crie um lote para começar a movimentação.'})}
async function batchForm(){const p=(await periods()).filter(x=>x.status==='OPEN');openModal('Novo lote','O lote deve estar dentro de um período aberto.',`<form id="f"><div class="grid"><label class="field"><span>Código</span><input name="code" required></label><label class="field"><span>Período</span><select name="period_id" required><option value="">Selecione</option>${p.map(x=>`<option value="${x.id}">${esc(x.code)} - ${dateBR(x.start_date)} a ${dateBR(x.end_date)}</option>`).join('')}</select></label><label class="field full"><span>Descrição</span><input name="description" required></label><label class="field"><span>Data inicial</span><input name="start_date" type="date"></label><label class="field"><span>Data final</span><input name="end_date" type="date"></label></div><div class="form-actions"><button type="button" class="btn secondary" data-close>Cancelar</button><button class="btn primary">Salvar</button></div></form>`);$('[data-close]').onclick=closeModal;$('#f').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));if(!b.start_date)delete b.start_date;if(!b.end_date)delete b.end_date;try{await api('/api/journal-batches',{method:'POST',body:b});closeModal();S.cache.batches=null;toast('Lote criado.');renderBatches()}catch(x){toast(x.message,'error')}}}
async function renderEntries(){const d=await api('/api/journal-entries?limit=300'),a=d.entries||[];tablePage({newLabel:'Novo lançamento',onNew:entryForm,cols:['Data','Lote','Documento','Descrição','Débito','Crédito','Situação',''],rows:a.length?a.map(x=>`<tr><td>${dateBR(x.entry_date)}</td><td class="code">${esc(x.batch_code||'')}</td><td>${esc(x.document_number||'')}</td><td>${esc(x.description||'')}</td><td>${money(x.total_debit)}</td><td>${money(x.total_credit)}</td><td>${badge(x.status)}</td><td><div class="actions"><button class="btn secondary sm" data-open="${x.id}">Abrir</button></div></td></tr>`).join(''):null,emptyTitle:'Nenhum lançamento',emptyText:'Inclua o primeiro lançamento contábil.'});$$('[data-open]').forEach(b=>b.onclick=()=>entryView(b.dataset.open))}
async function entryForm(){const [a,c,h,b,br]=await Promise.all([accounts(),ccs(),histories(),batches(),branches()]);const oa=a.filter(x=>x.active&&x.analytic),ob=b.filter(x=>x.status==='OPEN');if(ob.length===0)return toast('Crie primeiro um lote aberto.','error');if(oa.length<2)return toast('Cadastre pelo menos duas contas analíticas ativas.','error');const ao=oa.map(x=>`<option value="${x.id}">${esc(x.code)} - ${esc(x.name)}</option>`).join(''),co=c.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.code)} - ${esc(x.name)}</option>`).join(''),ho=h.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.code)} - ${esc(x.description)}</option>`).join(''),bro=br.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.code)} - ${esc(x.name)}</option>`).join('');openModal('Novo lançamento','O lançamento será salvo como rascunho.',`<form id="entryForm"><div class="grid three"><label class="field"><span>Lote</span><select name="batch_id" required><option value="">Selecione</option>${ob.map(x=>`<option value="${x.id}">${esc(x.code)} - ${esc(x.description)}</option>`).join('')}</select></label><label class="field"><span>Filial</span><select name="branch_id"><option value="">Sem filial</option>${bro}</select></label><label class="field"><span>Data</span><input name="entry_date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label class="field"><span>Documento</span><input name="document_number"></label><label class="field full"><span>Descrição</span><input name="description"></label></div><div class="section-title">Partidas</div><div class="lines"><table><thead><tr><th>D/C</th><th>Conta</th><th>Valor</th><th>Centro de custo</th><th>Histórico</th><th>Complemento</th><th></th></tr></thead><tbody id="lineBody"></tbody></table></div><div style="margin-top:9px"><button id="addLine" type="button" class="btn secondary sm">+ Adicionar linha</button></div><div class="totals"><span>Débito: <b id="totD">R$ 0,00</b></span><span>Crédito: <b id="totC">R$ 0,00</b></span><span id="bal" class="balance-bad"><b>Não fecha</b></span></div><div class="form-actions"><button type="button" class="btn secondary" data-close>Cancelar</button><button class="btn primary">Salvar rascunho</button></div></form>`,true);$('[data-close]').onclick=closeModal;const body=$('#lineBody');function row(side){return`<tr><td><select class="side"><option value="D" ${side==='D'?'selected':''}>D</option><option value="C" ${side==='C'?'selected':''}>C</option></select></td><td><select class="acct" required><option value="">Selecione</option>${ao}</select></td><td><input class="amt" inputmode="decimal" placeholder="0,00"></td><td><select class="cc"><option value="">Sem centro</option>${co}</select></td><td><select class="hist"><option value="">Sem histórico</option>${ho}</select></td><td><input class="comp"></td><td><button type="button" class="remove-line">×</button></td></tr>`}body.insertAdjacentHTML('beforeend',row('D'));body.insertAdjacentHTML('beforeend',row('C'));function num(v){const n=Number(String(v||'').replace(/\./g,'').replace(',','.'));return Number.isFinite(n)?n:0}function totals(){let d=0,c=0;$$('#lineBody tr').forEach(r=>{const v=num($('.amt',r).value);$('.side',r).value==='D'?d+=v:c+=v});$('#totD').textContent=money(d);$('#totC').textContent=money(c);const ok=d>0&&Math.abs(d-c)<.005;$('#bal').className=ok?'balance-ok':'balance-bad';$('#bal').innerHTML=ok?'<b>Fechado</b>':'<b>Não fecha</b>'}body.addEventListener('input',totals);body.addEventListener('click',e=>{if(e.target.classList.contains('remove-line')){if(body.children.length<=2)return toast('Mantenha pelo menos duas linhas.','error');e.target.closest('tr').remove();totals()}});$('#addLine').onclick=()=>body.insertAdjacentHTML('beforeend',row('D'));$('#entryForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),lines=$$('#lineBody tr').map(r=>({side:$('.side',r).value,account_id:$('.acct',r).value,amount:$('.amt',r).value,cost_center_id:$('.cc',r).value||null,history_template_id:$('.hist',r).value||null,history_complement:$('.comp',r).value||null})),payload={...Object.fromEntries(f),branch_id:f.get('branch_id')||null,lines};try{await api('/api/journal-entries',{method:'POST',body:payload});closeModal();toast('Lançamento salvo em rascunho.');renderEntries()}catch(x){toast(x.message,'error')}}}
async function entryView(id){try{const e=(await api('/api/journal-entries/'+id)).entry;openModal('Lançamento contábil',`${dateBR(e.entry_date)} • ${e.document_number||'Sem documento'}`,`<div class="grid three"><div class="field"><span>Situação</span><div>${badge(e.status)}</div></div><div class="field"><span>Débito</span><b>${money(e.total_debit)}</b></div><div class="field"><span>Crédito</span><b>${money(e.total_credit)}</b></div><div class="field full"><span>Descrição</span><div>${esc(e.description||'')}</div></div></div><div class="section-title">Partidas</div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>D/C</th><th>Conta</th><th>Valor</th><th>Centro de custo</th><th>Histórico</th></tr></thead><tbody>${(e.lines||[]).map(l=>`<tr><td>${l.line_no}</td><td>${l.side}</td><td>${esc(l.account_code)} - ${esc(l.account_name)}</td><td>${money(l.amount)}</td><td>${esc(l.cost_center_code||'')} ${esc(l.cost_center_name||'')}</td><td>${esc(l.history_description||l.history_complement||'')}</td></tr>`).join('')}</tbody></table></div><div class="form-actions">${e.status==='POSTED'?'<button id="voidBtn" class="btn danger">Anular</button>':''}<button class="btn secondary" data-close>Fechar</button>${e.status==='DRAFT'?'<button id="postBtn" class="btn success">Contabilizar</button>':''}</div>`,true);$('[data-close]').onclick=closeModal;if($('#postBtn'))$('#postBtn').onclick=async()=>{try{await api(`/api/journal-entries/${id}/post`,{method:'POST',body:{}});closeModal();toast('Lançamento contabilizado.');renderEntries()}catch(x){toast(x.message,'error')}};if($('#voidBtn'))$('#voidBtn').onclick=async()=>{const reason=prompt('Informe o motivo da anulação:');if(!reason)return;try{await api(`/api/journal-entries/${id}/void`,{method:'POST',body:{reason}});closeModal();toast('Lançamento anulado.');renderEntries()}catch(x){toast(x.message,'error')}}}catch(x){toast(x.message,'error')}}

function changePassword(){
  openModal('Alterar senha','Troque sua senha de acesso ao SAGAS.',`
    <form id="changePasswordForm" class="stack">
      <label class="field">
        <span>Senha atual</span>
        <input name="current_password" type="password" autocomplete="current-password" required>
      </label>
      <label class="field">
        <span>Nova senha</span>
        <input name="new_password" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label class="field">
        <span>Confirmar nova senha</span>
        <input name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <div class="help">Use pelo menos 8 caracteres e uma senha diferente da atual.</div>
      <div class="form-actions">
        <button type="button" class="btn secondary" data-close>Cancelar</button>
        <button class="btn primary">Alterar senha</button>
      </div>
    </form>
  `);

  $('[data-close]').onclick=closeModal;

  $('#changePasswordForm').onsubmit=async e=>{
    e.preventDefault();
    const f=new FormData(e.target);
    const current_password=String(f.get('current_password')||'');
    const new_password=String(f.get('new_password')||'');
    const confirm_password=String(f.get('confirm_password')||'');

    if(new_password!==confirm_password){
      toast('A confirmação da nova senha não confere.','error');
      return;
    }

    try{
      await api('/api/auth/change-password',{
        method:'POST',
        company:false,
        body:{current_password,new_password}
      });
      closeModal();
      toast('Senha alterada com sucesso.');
    }catch(x){
      toast(x.message,'error');
    }
  };
}

function apiConfig(){openModal('Configurar API','Informe a URL publicada do Cloudflare Worker.',`<form id="f"><label class="field"><span>URL da API</span><input id="apiUrl" required value="${esc(S.api)}" placeholder="https://seu-worker.workers.dev"></label><div class="form-actions"><button type="button" class="btn secondary" data-close>Cancelar</button><button class="btn primary">Salvar e testar</button></div></form>`);$('[data-close]').onclick=closeModal;$('#f').onsubmit=async e=>{e.preventDefault();const u=$('#apiUrl').value.trim().replace(/\/+$/,'');try{const r=await fetch(u+'/health'),d=await r.json();if(!r.ok||!d.ok)throw Error('A API não respondeu corretamente.');S.api=u;localStorage.setItem('erp_api',u);apiStatus();closeModal();toast('API configurada e conectada.')}catch(x){toast(x.message,'error')}}}
function bootstrap(){if(!S.api)return apiConfig();openModal('Primeiro acesso','Use somente na primeira configuração do banco.',`<form id="boot" class="stack"><div class="grid"><label class="field"><span>Chave de bootstrap</span><input name="secret" type="password" required></label><label class="field"><span>Código da empresa</span><input name="company_code" value="001" required></label><label class="field full"><span>Razão social</span><input name="company_name" required></label><label class="field"><span>Nome fantasia</span><input name="trade_name"></label><label class="field"><span>CNPJ</span><input name="tax_id"></label><label class="field"><span>Filial</span><input name="branch_name" value="Matriz"></label><label class="field"><span>Administrador</span><input name="admin_name" required></label><label class="field"><span>E-mail</span><input name="admin_email" type="email" required></label><label class="field"><span>Senha</span><input name="password" type="password" minlength="8" required></label></div><div class="form-actions"><button type="button" class="btn secondary" data-close>Cancelar</button><button class="btn primary">Criar ambiente</button></div></form>`);$('[data-close]').onclick=closeModal;$('#boot').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target)),secret=b.secret;delete b.secret;try{const d=await api('/api/bootstrap',{method:'POST',company:false,headers:{'X-Bootstrap-Secret':secret},body:b});S.token=d.token;S.user=d.user;S.companies=[d.company];S.companyId=d.company.id;save();closeModal();toast('Ambiente criado.');showApp()}catch(x){toast(x.message,'error')}}}
$('#modalClose').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target===$('#modalBackdrop'))closeModal()};$('#apiConfigLogin').onclick=apiConfig;$('#apiConfigApp').onclick=apiConfig;$('#changePasswordApp').onclick=changePassword;$('#bootstrapBtn').onclick=bootstrap;$('#loginForm').onsubmit=async e=>{e.preventDefault();if(!S.api)return apiConfig();try{const d=await api('/api/auth/login',{method:'POST',company:false,body:{email:$('#loginEmail').value.trim(),password:$('#loginPassword').value}});S.token=d.token;S.user=d.user;S.companies=d.companies||[];S.companyId=S.companies[0]?.id||'';save();showApp()}catch(x){toast(x.message,'error')}};$('#logoutBtn').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST',company:false,body:{}})}catch{}clear();showLogin()};$('#companySelect').onchange=e=>{S.companyId=e.target.value;S.cache={};save();nav(S.page)};$$('.nav[data-page]').forEach(b=>b.onclick=()=>{nav(b.dataset.page);$('#sidebar').classList.remove('open')});$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
(async()=>{apiStatus();if(S.token&&S.api){try{const d=await api('/api/auth/me',{company:false});S.user=d.user;S.companies=d.companies||[];if(!S.companies.some(x=>x.id===S.companyId))S.companyId=S.companies[0]?.id||'';save();if(S.user&&S.companies.length)return showApp()}catch{clear()}}showLogin()})();

</script>
