
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAGAS</title>
  <style>
:root{--blue:#1557d6;--blue2:#1048b4;--blueSoft:#edf3ff;--bg:#f5f7fb;--surface:#fff;--line:#dfe5ee;--line2:#edf1f5;--text:#172033;--muted:#697386;--danger:#c53d32;--success:#207a50;--warn:#956200;--side:238px;--shadow:0 18px 55px rgba(20,28,45,.16)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(135deg,rgba(21,87,214,.07),transparent 45%),#f7f9fc}.login-wrap{width:min(430px,100%)}.brand{display:flex;justify-content:center;align-items:center;gap:13px;margin-bottom:22px}.brand h1{font-size:24px;margin:0}.brand p{font-size:13px;color:var(--muted);margin:3px 0}.brand-icon{width:46px;height:46px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:23px;font-weight:800;box-shadow:0 8px 22px rgba(21,87,214,.22)}.brand-icon.small{width:35px;height:35px;border-radius:9px;font-size:17px;box-shadow:none}.login-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow)}.login-card h2{margin:0}.login-card>p{font-size:14px;margin:6px 0 22px}.stack{display:flex;flex-direction:column;gap:14px}.login-links{display:flex;justify-content:space-between;margin-top:16px}.link-btn{border:0;background:transparent;color:var(--blue);font-size:12px}.api-status{text-align:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line2);font-size:11px;color:var(--muted)}
.app{display:flex;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}.sidebar-brand{height:72px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line)}.sidebar-brand b{display:block;font-size:14px}.sidebar-brand small{display:block;color:var(--muted);margin-top:2px}.sidebar nav{padding:14px 10px;display:flex;flex-direction:column;gap:3px}.nav{border:0;background:transparent;width:100%;padding:10px 12px;border-radius:8px;text-align:left;color:#40506a;font-size:13px;display:flex;gap:10px;align-items:center}.nav:hover{background:#f5f8fd}.nav.active{background:var(--blueSoft);color:var(--blue);font-weight:650}.nav-section-title{padding:14px 12px 6px;font-size:10px;font-weight:800;color:#98a2b3;letter-spacing:.8px}.nav-section-title:first-child{padding-top:2px}.nav.secondary{color:var(--muted)}.sidebar-bottom{margin-top:auto;padding:10px;border-top:1px solid var(--line)}.main{margin-left:var(--side);width:calc(100% - var(--side))}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:30}.title-wrap{display:flex;align-items:center;gap:10px}.title-wrap h2{font-size:18px;margin:0}.title-wrap p{font-size:12px;margin:4px 0 0;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:18px}.company{display:flex;flex-direction:column;gap:3px}.company span{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}.company select{min-width:210px}.user{display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--blueSoft);color:var(--blue);font-weight:750}.user-info b{display:block;font-size:12px}.user-info small{display:block;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis}.icon-btn{border:0;background:transparent;padding:6px 8px;border-radius:7px;color:var(--muted);font-size:18px}.icon-btn:hover{background:#f1f4f8;color:var(--text)}.mobile{display:none}.content{padding:22px 26px 40px}
.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.search{width:320px;max-width:55vw}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{text-align:left;background:#f8fafc;padding:11px 12px;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.35px;color:#536073;white-space:nowrap}.table td{padding:11px 12px;border-bottom:1px solid var(--line2);font-size:12px}.table tbody tr:hover{background:#fbfcfe}.table tbody tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:50px 20px}.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:5px}.code{font-family:Consolas,monospace;color:#34435a}.actions{display:flex;justify-content:flex-end;gap:4px}
.btn{border:1px solid transparent;border-radius:8px;padding:9px 13px;font-weight:650;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue2)}.btn.secondary{background:#fff;border-color:var(--line);color:#354055}.btn.danger{background:#fff;border-color:#efc4c0;color:var(--danger)}.btn.success{background:#edf8f2;border-color:#c8e8d7;color:var(--success)}.btn.sm{padding:6px 9px;font-size:11px}.btn.block{width:100%;padding:11px}
.field{display:flex;flex-direction:column;gap:6px}.field span{font-size:11px;font-weight:650;color:#4a566b}.field input,.field select,.field textarea,.company select,.search{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;outline:0;color:var(--text)}.field textarea{min-height:84px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:#8aacf1;box-shadow:0 0 0 3px rgba(21,87,214,.08)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field.full{grid-column:1/-1}.check{display:flex;align-items:center;gap:7px;font-size:12px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2)}
.badge{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:700}.badge.blue{background:var(--blueSoft);color:var(--blue)}.badge.green{background:#eaf7f0;color:var(--success)}.badge.red{background:#fff0ef;color:var(--danger)}.badge.gray{background:#f0f2f5;color:#5d6675}.badge.yellow{background:#fff5d9;color:var(--warn)}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.40);display:grid;place-items:center;padding:24px;z-index:100}.modal-box{width:min(680px,96vw);max-height:92vh;background:#fff;border-radius:12px;box-shadow:0 24px 80px rgba(10,20,40,.3);display:flex;flex-direction:column;overflow:hidden}.modal-box.large{width:min(1080px,98vw)}.modal-box>header{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-box h3{margin:0;font-size:17px}.modal-box header p{margin:4px 0 0;color:var(--muted);font-size:11px}.modal-body{padding:20px;overflow:auto}.section-title{font-size:12px;font-weight:750;margin:17px 0 8px}.lines{border:1px solid var(--line);border-radius:8px;overflow:auto}.lines table{width:100%;min-width:900px;border-collapse:collapse}.lines th{background:#f8fafc;font-size:9px;text-transform:uppercase;text-align:left;color:#59667a;padding:8px;border-bottom:1px solid var(--line)}.lines td{padding:6px;border-bottom:1px solid var(--line2)}.lines input,.lines select{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px;font-size:11px}.remove-line{border:0;background:transparent;color:var(--danger);font-size:16px}.totals{display:flex;justify-content:flex-end;gap:22px;font-size:12px;padding:12px 2px}.balance-ok{color:var(--success)}.balance-bad{color:var(--danger)}
#toasts{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px}.toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;box-shadow:var(--shadow);padding:12px 14px;min-width:270px;max-width:430px;font-size:12px}.toast.error{border-left-color:var(--danger)}.toast.success{border-left-color:var(--success)}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.mobile{display:inline-flex}.topbar{padding:0 14px}.title-wrap p,.user-info,.company span{display:none}.company select{min-width:130px;max-width:155px}.content{padding:16px}}@media(max-width:650px){.grid,.grid.three{grid-template-columns:1fr}.toolbar{flex-direction:column}.search{width:100%;max-width:none}}

</style>
</head>
<body>
  <div id="toasts"></div>

  <section id="loginScreen" class="login-screen">
    <div class="login-wrap">
      <div class="brand"><div class="brand-icon">G</div><div><h1>SAGAS</h1><p>Sistema de Administração e Gestão</p></div></div>
      <div class="login-card">
        <h2>Entrar</h2><p class="muted">Acesse o ambiente da sua empresa.</p>
        <form id="loginForm" class="stack">
          <label class="field"><span>E-mail</span><input id="loginEmail" type="email" autocomplete="username" required></label>
          <label class="field"><span>Senha</span><input id="loginPassword" type="password" autocomplete="current-password" required></label>
          <button class="btn primary block">Entrar</button>
        </form>
        <div class="login-links"><button id="apiConfigLogin" class="link-btn">Configurar API</button><button id="bootstrapBtn" class="link-btn">Primeiro acesso</button></div>
        <div id="apiStatus" class="api-status">API não configurada</div>
      </div>
    </div>
  </section>

  <div id="app" class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand"><div class="brand-icon small">G</div><div><b>SAGAS</b><small>ERP</small></div></div>
      <nav>
        <div class="nav-section-title" data-nav-section="admin">ADMINISTRAÇÃO</div>
        <button class="nav" data-page="companies">▣ <span>Empresas</span></button>
        <button class="nav" data-page="branches-admin">▥ <span>Filiais</span></button>
        <button class="nav" data-page="users">● <span>Usuários</span></button>
        <button class="nav" data-page="roles">◆ <span>Perfis e Permissões</span></button>
        <div class="nav-section-title" data-nav-section="accounting">CONTÁBIL</div>
        <button class="nav active" data-page="accounts">▦ <span>Plano de Contas</span></button>
        <button class="nav" data-page="cost-centers">◎ <span>Centros de Custo</span></button>
        <button class="nav" data-page="history">≡ <span>Históricos Padrão</span></button>
        <button class="nav" data-page="periods">□ <span>Períodos Contábeis</span></button>
        <button class="nav" data-page="batches">▤ <span>Lotes</span></button>
        <button class="nav" data-page="entries">⇄ <span>Lançamentos</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button id="myAccountApp" class="nav secondary">👤 <span>Minha conta</span></button>
        <button id="changePasswordApp" class="nav secondary">🔒 <span>Alterar senha</span></button>
        <button id="apiConfigApp" class="nav secondary">⚙ <span>Configurar API</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-wrap"><button id="menuBtn" class="icon-btn mobile">☰</button><div><h2 id="pageTitle">Plano de Contas</h2><p id="pageSub">Cadastro e estrutura das contas contábeis</p></div></div>
        <div class="top-actions">
          <label class="company"><span>Empresa</span><select id="companySelect"></select></label>
          <div class="user"><div id="avatar" class="avatar">U</div><div class="user-info"><b id="userName">Usuário</b><small id="userEmail"></small></div><button id="logoutBtn" class="icon-btn" title="Sair">↪</button></div>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div id="modal" class="modal-box">
      <header><div><h3 id="modalTitle"></h3><p id="modalSub"></p></div><button id="modalClose" class="icon-btn">×</button></header>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
const S={api:localStorage.getItem('erp_api')||'',token:localStorage.getItem('erp_token')||'',user:JSON.parse(localStorage.getItem('erp_user')||'null'),companies:JSON.parse(localStorage.getItem('erp_companies')||'[]'),companyId:localStorage.getItem('erp_company')||'',page:'accounts',cache:{},permissions:[]};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const meta={companies:['Empresas','Empresas disponíveis para o usuário'], 'branches-admin':['Filiais','Filiais vinculadas à empresa selecionada'], users:['Usuários','Usuários com acesso à empresa selecionada'], roles:['Perfis e Permissões','Perfis de acesso e permissões da empresa'], accounts:['Plano de Contas','Cadastro e estrutura das contas contábeis'],'cost-centers':['Centros de Custo','Estrutura gerencial para rateios e análises'],history:['Históricos Padrão','Textos padronizados utilizados nos lançamentos'],periods:['Períodos Contábeis','Controle de abertura e validade dos lançamentos'],batches:['Lotes','Agrupamento e controle dos lançamentos contábeis'],entries:['Lançamentos','Movimentação contábil por débito e crédito']};
function toast(m,t='success'){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),4200)}
function money(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0))}
function dateBR(v){if(!v)return'';const p=String(v).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v}
function nextDateLocal(value){if(!value)return'';const d=new Date(`${value}T00:00:00Z`);d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)}
function officialState(x){return x==='INTEGRATED'?badge('INTEGRATED'):badge('PENDING')}
function dateTimeBR(v){
  if(!v)return'—';
  const raw=String(v).trim().replace(' ','T');
  const d=new Date(raw.endsWith('Z')||/[+-]\d\d:\d\d$/.test(raw)?raw:raw+'Z');
  return Number.isNaN(d.getTime())?String(v):d.toLocaleString('pt-BR');
}
function currentCompany(){return S.companies.find(x=>x.id===S.companyId)||null}
function htmlText(v){return esc(v==null?'':String(v))}


function save(){localStorage.setItem('erp_token',S.token||'');localStorage.setItem('erp_user',JSON.stringify(S.user));localStorage.setItem('erp_companies',JSON.stringify(S.companies));localStorage.setItem('erp_company',S.companyId||'')}
function clear(){S.token='';S.user=null;S.companies=[];S.companyId='';S.cache={};['erp_token','erp_user','erp_companies','erp_company'].forEach(localStorage.removeItem.bind(localStorage))}
let sessionCheckBusy=false;
function loseSession(message='Sua sessão foi encerrada. Entre novamente.'){if(!S.token)return;clear();S.permissions=[];closeModal();showLogin();toast(message,'error')}
async function api(path,opt={}){if(!S.api)throw Error('Configure a URL da API.');const h={...(opt.headers||{})};let body=opt.body;if(body&&typeof body!=='string'){h['Content-Type']='application/json';body=JSON.stringify(body)}if(S.token)h.Authorization='Bearer '+S.token;if(S.companyId&&opt.company!==false)h['X-Company-Id']=S.companyId;const r=await fetch(S.api.replace(/\/+$/,'')+path,{...opt,headers:h,body});let d={};try{d=await r.json()}catch{}if(!r.ok||d.ok===false){const e=Error(d?.error?.message||`Erro HTTP ${r.status}`);e.status=r.status;e.code=d?.error?.code;if(r.status===401&&opt.authRedirect!==false)loseSession('Seu acesso foi encerrado. Entre novamente.');throw e}return d}
async function checkSessionAccess(){if(sessionCheckBusy||!S.token||!S.api)return;sessionCheckBusy=true;try{const d=await api('/api/auth/me',{company:false,authRedirect:false});S.user=d.user;S.companies=d.companies||[];if(!S.companies.length){loseSession('Seu usuário não possui mais acesso ativo a nenhuma empresa.');return}if(!S.companies.some(c=>c.id===S.companyId)){S.companyId=S.companies[0].id;S.cache={};save();chrome();await loadPermissions();if(!canPage(S.page))S.page=firstAllowedPage();await nav(S.page)}}catch(e){if(e.status===401)loseSession('Seu acesso foi encerrado. Entre novamente.')}finally{sessionCheckBusy=false}}
function openModal(t,sub,html,large=false){$('#modalTitle').textContent=t;$('#modalSub').textContent=sub||'';$('#modalBody').innerHTML=html;$('#modal').classList.toggle('large',large);$('#modalBackdrop').classList.remove('hidden')}
function closeModal(){$('#modalBackdrop').classList.add('hidden')}
function badge(s){const m={OPEN:['Aberto','green'],CLOSED:['Fechado','gray'],LOCKED:['Bloqueado','red'],POSTED:['Contabilizado','green'],VOID:['Anulado','red'],OFFICIAL:['Oficial','blue'],INTEGRATED:['Lote 0','blue'],PENDING:['Pendente','yellow']};const x=m[s]||[s||'-','gray'];return`<span class="badge ${x[1]}">${esc(x[0])}</span>`}
function empty(cols,t,x){return`<tr><td colspan="${cols}"><div class="empty"><b>${esc(t)}</b>${esc(x)}</div></td></tr>`}
function tablePage({newLabel,onNew,cols,rows,emptyTitle,emptyText,placeholder='Pesquisar...'}){const newButton=newLabel&&onNew?`<button id="newBtn" class="btn primary">+ ${esc(newLabel)}</button>`:'';$('#content').innerHTML=`<div class="toolbar"><input id="search" class="search" placeholder="${esc(placeholder)}">${newButton}</div><div class="table-wrap"><table class="table"><thead><tr>${cols.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody id="tbody">${rows||empty(cols.length,emptyTitle,emptyText)}</tbody></table></div>`;if($('#newBtn'))$('#newBtn').onclick=onNew;$('#search').oninput=e=>{const q=e.target.value.toLowerCase().trim();$$('#tbody tr').forEach(r=>r.style.display=!q||r.innerText.toLowerCase().includes(q)?'':'none')}}

const pagePermission={companies:'core.company.manage','branches-admin':'core.branch.read',users:'core.user.read',roles:'core.role.manage',accounts:'accounting.account.read','cost-centers':'accounting.cost_center.read',history:'accounting.history.read',periods:'accounting.period.read',batches:'accounting.batch.read',entries:'accounting.entry.read'};
const navGroups={admin:['companies','branches-admin','users','roles'],accounting:['accounts','cost-centers','history','periods','batches','entries']};
function can(code){return S.permissions.includes(code)}
function canPage(page){const code=pagePermission[page];return !code||can(code)}
function firstAllowedPage(){return ['companies','branches-admin','users','roles','accounts','cost-centers','history','periods','batches','entries'].find(canPage)||'accounts'}
function applyMenuAccess(){$$('.nav[data-page]').forEach(btn=>btn.classList.toggle('hidden',!canPage(btn.dataset.page)));Object.entries(navGroups).forEach(([group,pages])=>{const title=$(`[data-nav-section="${group}"]`);if(title)title.classList.toggle('hidden',!pages.some(canPage))})}
async function loadPermissions(){if(!S.companyId){S.permissions=[];applyMenuAccess();return}const d=await api('/api/auth/permissions');S.permissions=d.permissions||[];applyMenuAccess()}

function showLogin(){$('#app').classList.add('hidden');$('#loginScreen').classList.remove('hidden');apiStatus()}
async function showApp(){$('#loginScreen').classList.add('hidden');$('#app').classList.remove('hidden');chrome();await loadPermissions();if(!canPage(S.page))S.page=firstAllowedPage();await nav(S.page)}
function chrome(){$('#userName').textContent=S.user?.name||'Usuário';$('#userEmail').textContent=S.user?.email||'';$('#avatar').textContent=(S.user?.name||'U').trim()[0].toUpperCase();$('#companySelect').innerHTML=S.companies.map(c=>`<option value="${esc(c.id)}">${esc(c.code)} - ${esc(c.legal_name)}</option>`).join('');$('#companySelect').value=S.companyId}
function apiStatus(){$('#apiStatus').textContent=S.api?'API: '+S.api:'API não configurada'}
async function nav(p){if(!canPage(p))p=firstAllowedPage();S.page=p;$('#pageTitle').textContent=meta[p][0];$('#pageSub').textContent=meta[p][1];$$('.nav[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#content').innerHTML='<div class="empty"><b>Carregando...</b></div>';try{if(p==='companies')await renderCompanies();if(p==='branches-admin')await renderBranchesAdmin();if(p==='users')await renderUsers();if(p==='roles')await renderRoles();if(p==='accounts')await renderAccounts();if(p==='cost-centers')await renderCC();if(p==='history')await renderHistory();if(p==='periods')await renderPeriods();if(p==='batches')await renderBatches();if(p==='entries')await renderEntries()}catch(e){$('#content').innerHTML=`<div class="empty"><b>Não foi possível carregar</b>${esc(e.message)}</div>`;if(e.status===401){clear();showLogin()}}}

async function refreshSession(){const d=await api('/api/auth/me',{company:false});S.user=d.user;S.companies=d.companies||[];if(!S.companies.length){loseSession('Seu usuário não possui acesso ativo a nenhuma empresa.');return}if(!S.companies.some(c=>c.id===S.companyId))S.companyId=S.companies[0]?.id||'';save();chrome();await loadPermissions()}
async function companyList(force=false){if(!force&&S.cache.companies)return S.cache.companies;const d=await api('/api/companies',{company:false});return S.cache.companies=d.companies||[]}

async function permissionList(force=false){if(!force&&S.cache.permissions)return S.cache.permissions;const d=await api('/api/permissions');return S.cache.permissions=d.permissions||[]}

const ACCOUNT_MASK_WIDTHS=[1,2,2,2,4];
const ACCOUNT_MASK_CUMULATIVE=[1,3,5,7,11];

function parseAccountMaskLocal(value){
  const raw=String(value||'').replace(/\D/g,'');
  const ix=ACCOUNT_MASK_CUMULATIVE.indexOf(raw.length);
  if(ix<0)return null;
  let pos=0,parts=[];
  for(let i=0;i<=ix;i++){const w=ACCOUNT_MASK_WIDTHS[i];parts.push(raw.slice(pos,pos+w));pos+=w}
  return {raw,code:parts.join('.'),level:ix+1,analytic:ix===4,parentCode:ix>0?parts.slice(0,-1).join('.'):null};
}

function accountSegmentNumber(code){
  const p=parseAccountMaskLocal(code);
  if(!p)return 0;
  const part=p.code.split('.').at(-1);
  return Number(part)||0;
}

function formatAccountSegment(n,width){
  return String(n).padStart(width,'0');
}

function nextAccountFromBase(base,list){
  const parsed=parseAccountMaskLocal(base.code);
  if(!parsed)return '';

  if(parsed.level<5){
    const childWidth=ACCOUNT_MASK_WIDTHS[parsed.level];
    const children=list.filter(x=>x.parent_id===base.id)
      .map(x=>parseAccountMaskLocal(x.code))
      .filter(Boolean)
      .filter(x=>x.level===parsed.level+1);

    const max=children.reduce((m,x)=>Math.max(m,Number(x.code.split('.').at(-1))||0),0);
    return `${parsed.code}.${formatAccountSegment(max+1,childWidth)}`;
  }

  const siblings=list.filter(x=>x.parent_id===base.parent_id)
    .map(x=>parseAccountMaskLocal(x.code))
    .filter(Boolean)
    .filter(x=>x.level===5);

  const max=siblings.reduce((m,x)=>Math.max(m,Number(x.code.split('.').at(-1))||0),0);
  const prefix=parsed.code.split('.').slice(0,-1).join('.');
  return `${prefix}.${formatAccountSegment(max+1,4)}`;
}

function findParentByCode(code,list){
  const parsed=parseAccountMaskLocal(code);
  if(!parsed?.parentCode)return null;
  return list.find(x=>x.code===parsed.parentCode)||null;
}


const collapsedAccountTree=new Set();

function accountDepth(a,list){
  let depth=0,current=a,seen=new Set();
  while(current?.parent_id && depth<20){
    if(seen.has(current.id))break;
    seen.add(current.id);
    current=list.find(x=>x.id===current.parent_id);
    if(!current)break;
    depth++;
  }
  return depth;
}

function orderedAccountTree(list){
  const byParent=new Map();
  list.forEach(x=>{
    const k=x.parent_id||'__root__';
    if(!byParent.has(k))byParent.set(k,[]);
    byParent.get(k).push(x);
  });
  byParent.forEach(arr=>arr.sort((a,b)=>String(a.code).localeCompare(String(b.code),'pt-BR',{numeric:true})));

  const out=[];
  const seen=new Set();

  function walk(parentId,depth){
    const rows=byParent.get(parentId||'__root__')||[];
    for(const x of rows){
      if(seen.has(x.id))continue;
      seen.add(x.id);
      out.push({...x,_depth:depth});
      walk(x.id,depth+1);
    }
  }

  walk(null,0);

  // Segurança para contas órfãs
  list.filter(x=>!seen.has(x.id))
      .sort((a,b)=>String(a.code).localeCompare(String(b.code),'pt-BR',{numeric:true}))
      .forEach(x=>out.push({...x,_depth:0}));

  return out;
}

function accountDescendantIds(id,list){
  const out=[];
  const stack=[id];
  while(stack.length){
    const p=stack.pop();
    list.filter(x=>x.parent_id===p).forEach(x=>{
      out.push(x.id);
      stack.push(x.id);
    });
  }
  return out;
}

async function renderAccounts(){
  const a=await accounts(true),manage=can('accounting.account.manage');
  const ordered=orderedAccountTree(a);

  const rows=ordered.length?ordered.map(x=>{
    const hasChildren=a.some(y=>y.parent_id===x.id);
    const isCollapsed=collapsedAccountTree.has(x.id);
    const indent=x._depth*24;

    return `<tr data-account-row="${x.id}" data-parent-id="${esc(x.parent_id||'')}" data-depth="${x._depth}">
      <td class="code">
        <div style="display:flex;align-items:center;gap:6px;padding-left:${indent}px">
          ${hasChildren
            ? `<button class="btn secondary sm" data-tree-toggle="${x.id}" title="${isCollapsed?'Expandir':'Recolher'}" style="padding:2px 7px;min-width:28px">${isCollapsed?'▶':'▼'}</button>`
            : `<span style="display:inline-block;width:28px"></span>`}
          <span>${esc(x.code)}</span>
        </div>
      </td>
      <td class="code">${esc(x.reduced_code||'')}</td>
      <td>${esc(x.name)}</td>
      <td>${esc(accountClass(x.account_class))}</td>
      <td>${x.analytic?'<span class="badge blue">Analítica</span>':'<span class="badge gray">Sintética</span>'}</td>
      <td>${x.active?'<span class="badge green">Ativa</span>':'<span class="badge red">Inativa</span>'}</td>
      ${manage?`<td><div class="actions">
        <button class="btn secondary sm" data-add-from="${x.id}" title="${x.analytic?'Adicionar próxima conta analítica':'Adicionar conta abaixo desta'}">+</button>
        <button class="btn secondary sm" data-edit="${x.id}">Editar</button>
        <button class="btn danger sm" data-delete-account="${x.id}">Excluir</button>
      </div></td>`:''}
    </tr>`;
  }).join(''):null;

  tablePage({
    newLabel:manage?'Nova conta':null,
    onNew:manage?()=>accountForm():null,
    cols:['Código','Reduzido','Descrição','Natureza','Tipo','Situação',...(manage?['Ações']:[])],
    rows,
    emptyTitle:'Nenhuma conta cadastrada',
    emptyText:manage?'Cadastre a primeira conta do plano de contas.':'Nenhuma conta disponível para consulta.',
    placeholder:'Pesquisar por código, reduzido ou descrição...'
  });

  function applyTreeVisibility(){
    const q=($('#search')?.value||'').toLowerCase().trim();

    if(q){
      $$('[data-account-row]').forEach(r=>{
        r.style.display=r.innerText.toLowerCase().includes(q)?'':'none';
      });
      return;
    }

    const hiddenIds=new Set();
    collapsedAccountTree.forEach(id=>{
      accountDescendantIds(id,a).forEach(x=>hiddenIds.add(x));
    });

    $$('[data-account-row]').forEach(r=>{
      r.style.display=hiddenIds.has(r.dataset.accountRow)?'none':'';
    });
  }

  if($('#search')) $('#search').oninput=applyTreeVisibility;

  $$('[data-tree-toggle]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.treeToggle;
    if(collapsedAccountTree.has(id))collapsedAccountTree.delete(id);
    else collapsedAccountTree.add(id);
    renderAccounts();
  });

  if(manage){
    $$('[data-edit]').forEach(b=>b.onclick=()=>accountForm(a.find(x=>x.id===b.dataset.edit)));

    $$('[data-add-from]').forEach(b=>{
      b.onclick=()=>{
        const base=a.find(x=>x.id===b.dataset.addFrom);
        accountForm(null,base);
      };

const COST_CENTER_MASK_WIDTHS=[2,2,3];
const COST_CENTER_MASK_CUMULATIVE=[2,4,7];
const collapsedCostCenterTree=new Set();

function parseCostCenterMaskLocal(value){
  const raw=String(value||'').replace(/\D/g,'');
  const ix=COST_CENTER_MASK_CUMULATIVE.indexOf(raw.length);
  if(ix<0)return null;
  let pos=0,parts=[];
  for(let i=0;i<=ix;i++){const w=COST_CENTER_MASK_WIDTHS[i];parts.push(raw.slice(pos,pos+w));pos+=w}
  return {raw,code:parts.join('.'),level:ix+1,analytic:ix===2,parentCode:ix>0?parts.slice(0,-1).join('.'):null};
}

function nextCostCenterFromBase(base,list){
  const parsed=parseCostCenterMaskLocal(base.code); if(!parsed)return '';
  if(parsed.level<3){
    const width=COST_CENTER_MASK_WIDTHS[parsed.level];
    const children=list.filter(x=>x.parent_id===base.id).map(x=>parseCostCenterMaskLocal(x.code)).filter(Boolean).filter(x=>x.level===parsed.level+1);
    const max=children.reduce((m,x)=>Math.max(m,Number(x.code.split('.').at(-1))||0),0);
    return `${parsed.code}.${String(max+1).padStart(width,'0')}`;
  }
  const siblings=list.filter(x=>x.parent_id===base.parent_id).map(x=>parseCostCenterMaskLocal(x.code)).filter(Boolean).filter(x=>x.level===3);
  const max=siblings.reduce((m,x)=>Math.max(m,Number(x.code.split('.').at(-1))||0),0);
  const prefix=parsed.code.split('.').slice(0,-1).join('.');
  return `${prefix}.${String(max+1).padStart(3,'0')}`;
}

function orderedCostCenterTree(list){
  const byParent=new Map();
  list.forEach(x=>{const k=x.parent_id||'__root__';if(!byParent.has(k))byParent.set(k,[]);byParent.get(k).push(x)});
  byParent.forEach(arr=>arr.sort((a,b)=>String(a.code).localeCompare(String(b.code),'pt-BR',{numeric:true})));
  const out=[],seen=new Set();
  function walk(parentId,depth){for(const x of (byParent.get(parentId||'__root__')||[])){if(seen.has(x.id))continue;seen.add(x.id);out.push({...x,_depth:depth});walk(x.id,depth+1)}}
  walk(null,0);
  list.filter(x=>!seen.has(x.id)).sort((a,b)=>String(a.code).localeCompare(String(b.code),'pt-BR',{numeric:true})).forEach(x=>out.push({...x,_depth:0}));
  return out;
}

function costCenterDescendantIds(id,list){const out=[],stack=[id];while(stack.length){const p=stack.pop();list.filter(x=>x.parent_id===p).forEach(x=>{out.push(x.id);stack.push(x.id)})}return out}

  const a=await ccs(true),manage=can('accounting.cost_center.manage');

  const rows=ordered.length?ordered.map(x=>{
    const parsed=parseCostCenterMaskLocal(x.code),hasChildren=a.some(y=>y.parent_id===x.id),isCollapsed=collapsedCostCenterTree.has(x.id),indent=x._depth*24;
    return `<tr data-cc-row="${x.id}"><td class="code"><div style="display:flex;align-items:center;gap:6px;padding-left:${indent}px">${hasChildren?`<button class="btn secondary sm" data-cc-toggle="${x.id}" title="${isCollapsed?'Expandir':'Recolher'}" style="padding:2px 7px;min-width:28px">${isCollapsed?'▶':'▼'}</button>`:`<span style="display:inline-block;width:28px"></span>`}<span>${esc(x.code)}</span></div></td><td>${esc(x.name)}</td><td>${parsed?.analytic?'<span class="badge blue">Analítico</span>':'<span class="badge gray">Sintético</span>'}</td><td>${x.active?'<span class="badge green">Ativo</span>':'<span class="badge red">Inativo</span>'}</td>${manage?`<td><div class="actions"><button class="btn secondary sm" data-add-cc="${x.id}" title="${parsed?.analytic?'Adicionar próximo centro analítico':'Adicionar centro abaixo deste'}">+</button><button class="btn secondary sm" data-edit-cc="${x.id}">Editar</button><button class="btn danger sm" data-delete-cc="${x.id}">Excluir</button></div></td>`:''}</tr>`;

function periodCodeLocal(start,end){
  if(!start||!end)return 'Automático';
  const sy=start.slice(0,4),ey=end.slice(0,4);
  if(sy===ey&&start===`${sy}-01-01`&&end===`${sy}-12-31`)return sy;
  return `${start.replaceAll('-','')}-${end.replaceAll('-','')}`;
}

function periodStateBadge(p){
  if(p.status==='LOCKED')return badge('LOCKED');
  if(p.closed_until&&p.closed_until>=p.end_date)return badge('CLOSED');
  return badge('OPEN');
}

  const end=item?.end_date||`${y}-12-31`;

  openModal(
    item?'Editar período contábil':'Novo período contábil',

    `<form id="periodForm">
      <div class="grid">
        <label class="field">
          <span>Código</span>

        </label>

        <div class="field">
          <span>Situação</span>
          <div style="padding-top:9px">${item?periodStateBadge(item):badge('OPEN')}</div>
        </div>

        <label class="field"><span>Data inicial</span><input name="start_date" type="date" required value="${start}"></label>

      </div>

      <div class="form-actions">
        <button type="button" class="btn secondary" data-close>Cancelar</button>
        <button class="btn primary">${item?'Salvar alterações':'Criar período'}</button>
      </div>
    </form>`
  );

  $('[data-close]').onclick=closeModal;
  const form=$('#periodForm');

  function updateCode(){
    $('#periodCodePreview').value=periodCodeLocal(form.start_date.value,form.end_date.value);
  }

  form.start_date.onchange=updateCode;
  form.end_date.onchange=updateCode;

  form.onsubmit=async e=>{
    e.preventDefault();

    try{

      toast(item?'Período atualizado.':'Período criado.');

async function renderBatches(){

  const officialRow=`<tr style="background:#f8fbff">

    <td><b>LOTE OFICIAL</b></td>
    <td>—</td>
    <td>Automática</td>

    <td>${official.end_date?dateBR(official.end_date):'—'}</td>
    <td>${official.total_entries||0}</td>
    <td>${badge('OFFICIAL')}</td>
    <td><div class="actions"><button class="btn secondary sm" id="openOfficialBatch">Abrir oficial</button></div></td>
  </tr>`;

  const rows=a.map(x=>`<tr>
    <td class="code">${esc(x.code)}</td>
    <td>${esc(x.description)}</td>
    <td>${esc(x.period_code||p.find(y=>y.id===x.period_id)?.code||'')}</td>

    <td>${dateBR(x.end_date)}</td>
    <td>${x.total_entries||0} <span style="color:var(--muted)">(${x.integrated_entries||0} oficial)</span></td>
    <td>${badge(x.status)}</td>
    <td><div class="actions">
      <button class="btn secondary sm" data-open-batch="${x.id}">Abrir</button>
      ${manage?`<button class="btn secondary sm" data-edit-batch="${x.id}">Editar</button>
      <button class="btn secondary sm" data-lock-batch="${x.id}">${x.status==='LOCKED'?'Desbloquear':'Bloquear'}</button>
      <button class="btn danger sm" data-delete-batch="${x.id}">Excluir</button>`:''}
    </div></td>
  </tr>`).join('');

  tablePage({
    newLabel:manage?'Novo lote':null,
    onNew:manage?()=>batchForm():null,
    cols:['Código','Descrição','Período','Capa','Início','Fim','Lançamentos','Situação','Ações'],
    rows:officialRow+rows,

      const x=a.find(y=>y.id===b.dataset.lockBatch);

        await api(`/api/journal-batches/${x.id}/${x.status==='LOCKED'?'unlock':'lock'}`,{method:'POST',body:{}});
        S.cache.batches=null;
        toast(x.status==='LOCKED'?'Lote desbloqueado.':'Lote bloqueado.');
        renderBatches();
      }catch(e){toast(e.message,'error')}

      const x=a.find(y=>y.id===b.dataset.deleteBatch);

async function batchForm(item=null){
  const p=(await periods()).filter(x=>x.status!=='LOCKED' && !(x.closed_until && x.closed_until>=x.end_date));
  const selectedPeriod=item?p.find(x=>x.id===item.period_id):null;

  openModal(
    item?'Editar lote':'Novo lote',
    'Lotes N são áreas de trabalho. Os lançamentos contabilizados podem ser integrados posteriormente ao Lote 0 Oficial.',
    `<form id="batchForm">
      <div class="grid">
        <label class="field"><span>Código</span><input value="${esc(item?.code||'Automático')}" readonly style="background:#f3f4f6;color:var(--muted)"></label>

        <label class="field"><span>Período</span>
          <select name="period_id" required ${item?'disabled':''}>
            <option value="">Selecione</option>
            ${p.map(x=>`<option value="${x.id}" ${x.id===item?.period_id?'selected':''}>${esc(x.code)} - ${dateBR(x.start_date)} a ${dateBR(x.end_date)}${x.closed_until?` | fechado até ${dateBR(x.closed_until)}`:''}</option>`).join('')}
          </select>
        </label>

        <label class="field full"><span>Descrição</span><input name="description" value="${esc(item?.description||'')}" required></label>

        <label class="check full"><input name="manual_cover" type="checkbox" ${item?.cover_mode==='MANUAL'?'checked':''}> Digitar capa do lote</label>

        <div id="manualCoverFields" class="full" style="display:none">
          <div class="grid">
            <label class="field"><span>Data inicial da capa</span><input name="start_date" type="date" value="${esc(item?.start_date||'')}"></label>
            <label class="field"><span>Data final da capa</span><input name="end_date" type="date" value="${esc(item?.end_date||'')}"></label>
            <label class="field full"><span>Valor total da capa</span><input name="cover_amount" inputmode="decimal" value="${item?.cover_amount!=null?String(item.cover_amount).replace('.',','):''}" placeholder="0,00"></label>
          </div>
        </div>

        <div id="autoCoverInfo" class="field full" style="padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#f8fafc;color:var(--muted)">
          Na capa automática, o SAGAS usa o intervalo disponível do período contábil.
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn secondary" data-close>Cancelar</button>
        <button class="btn primary">${item?'Salvar alterações':'Criar lote'}</button>
      </div>
    </form>`
  );

  $('[data-close]').onclick=closeModal;
  const form=$('#batchForm'),manual=form.manual_cover,manualFields=$('#manualCoverFields'),autoInfo=$('#autoCoverInfo');

  function selected(){return p.find(x=>x.id===form.period_id.value)||selectedPeriod}

  function fillAutomaticInfo(){
    const per=selected();
    if(!per){autoInfo.innerHTML='Selecione o período contábil.';return}
    const start=per.closed_until?nextDateLocal(per.closed_until):per.start_date;
    autoInfo.innerHTML=`Capa automática: <b>${dateBR(start)} a ${dateBR(per.end_date)}</b>.`;
  }

  function toggleCover(){
    manualFields.style.display=manual.checked?'block':'none';
    autoInfo.style.display=manual.checked?'none':'block';

    if(!manual.checked){
      fillAutomaticInfo();
    }else{
      const per=selected();
      if(per&&!form.start_date.value)form.start_date.value=per.closed_until?nextDateLocal(per.closed_until):per.start_date;
      if(per&&!form.end_date.value)form.end_date.value=per.end_date;
    }
  }

  manual.onchange=toggleCover;
  form.period_id.onchange=toggleCover;
  toggleCover();

  form.onsubmit=async e=>{
    e.preventDefault();

    const body={description:e.target.description.value.trim(),cover_mode:e.target.manual_cover.checked?'MANUAL':'AUTO'};
    if(!item)body.period_id=e.target.period_id.value;

    if(e.target.manual_cover.checked){
      body.start_date=e.target.start_date.value;
      body.end_date=e.target.end_date.value;
      body.cover_amount=e.target.cover_amount.value;
    }

    try{
      await api(item?`/api/journal-batches/${item.id}`:'/api/journal-batches',{method:item?'PATCH':'POST',body});
      closeModal();
      S.cache.batches=null;
      toast(item?'Lote atualizado.':'Lote criado.');
      renderBatches();
    }catch(x){toast(x.message,'error')}
  };
}

const ENTRY_FILTER_FIELDS={
  entry_date:{label:'Data',type:'date'},
  batch_code:{label:'Lote',type:'text'},
  document_number:{label:'Documento',type:'text'},
  description:{label:'Descrição',type:'text'},
  total_debit:{label:'Débito',type:'money'},
  total_credit:{label:'Crédito',type:'money'},
  status:{label:'Situação',type:'status'},
  official_status:{label:'Oficial',type:'official'},
  branch:{label:'Filial',type:'text'},
  account:{label:'Conta',type:'text'},
  cost_center:{label:'Centro de custo',type:'text'}
};

const ENTRY_FILTER_OPERATORS={
  text:[
    ['contains','Contém'],['eq','Igual a'],['neq','Diferente de'],
    ['starts','Começa com'],['ends','Termina com'],['blank','Está vazio'],['not_blank','Não está vazio']
  ],
  date:[
    ['eq','Igual a'],['neq','Diferente de'],['gt','Maior que'],['gte','Maior ou igual'],
    ['lt','Menor que'],['lte','Menor ou igual'],['between','Entre']
  ],
  money:[
    ['eq','Igual a'],['neq','Diferente de'],['gt','Maior que'],['gte','Maior ou igual'],
    ['lt','Menor que'],['lte','Menor ou igual'],['between','Entre']
  ],
  status:[['eq','Igual a'],['neq','Diferente de']],
  official:[['eq','Igual a'],['neq','Diferente de']]
};

async function entryFilters(force=false){
  if(!force&&S.cache.entryFilters)return S.cache.entryFilters;
  const d=await api('/api/journal-entry-filters');
  return S.cache.entryFilters=d.filters||[];
}

function filterFieldOptions(selected=''){
  return Object.entries(ENTRY_FILTER_FIELDS).map(([k,v])=>`<option value="${k}" ${k===selected?'selected':''}>${esc(v.label)}</option>`).join('');
}

function filterOperatorOptions(field,selected=''){
  const type=ENTRY_FILTER_FIELDS[field]?.type||'text';
  return (ENTRY_FILTER_OPERATORS[type]||ENTRY_FILTER_OPERATORS.text)
    .map(([k,label])=>`<option value="${k}" ${k===selected?'selected':''}>${esc(label)}</option>`).join('');
}

function filterValueControl(field,operator,value='',value2=''){
  if(operator==='blank'||operator==='not_blank')return `<span style="color:var(--muted)">Sem valor</span>`;

  const type=ENTRY_FILTER_FIELDS[field]?.type||'text';
  const second=operator==='between';

  if(type==='status'){
    const options=[['POSTED','Contabilizado'],['VOID','Anulado']];
    return `<select class="filter-value">${options.map(([v,l])=>`<option value="${v}" ${v===value?'selected':''}>${l}</option>`).join('')}</select>`;
  }

  if(type==='official'){
    const options=[['PENDING','Pendente'],['INTEGRATED','Lote 0']];
    return `<select class="filter-value">${options.map(([v,l])=>`<option value="${v}" ${v===value?'selected':''}>${l}</option>`).join('')}</select>`;
  }

  const inputType=type==='date'?'date':'text';
  const placeholder=type==='money'?'0,00':'Valor';
  return `<div style="display:flex;gap:6px;align-items:center">
    <input class="filter-value" type="${inputType}" value="${esc(value||'')}" placeholder="${placeholder}">
    ${second?`<span style="color:var(--muted)">e</span><input class="filter-value2" type="${inputType}" value="${esc(value2||'')}" placeholder="${placeholder}">`:''}
  </div>`;
}

function entryFilterExpression(definition){
  const c=definition?.conditions||[];
  if(!c.length)return 'Todos os lançamentos';

  const opLabel={};
  Object.values(ENTRY_FILTER_OPERATORS).flat().forEach(([k,v])=>opLabel[k]=v);

  return c.map((x,i)=>{
    const f=ENTRY_FILTER_FIELDS[x.field]?.label||x.field;
    const val=(x.operator==='blank'||x.operator==='not_blank')?'':` "${x.value||''}"${x.operator==='between'?` e "${x.value2||''}"`:''}`;
    return `${i?((x.logic||'AND')==='OR'?'OU ':'E '):''}${f} ${opLabel[x.operator]||x.operator}${val}`;
  }).join(' ');
}

function currentEntryFilterDefinition(){
  return S.entryFilter?.definition||{conditions:[]};
}

      <button id="applyEntryFilter" type="button" class="btn primary">Aplicar filtro</button>
    </div>`,
    true
  );

  const tbody=$('#filterConditionBody');

  function readDefinition(){
    const conditions=$$('#filterConditionBody tr').map((tr,i)=>({
      logic:i===0?'AND':$('.filter-logic',tr).value,
      field:$('.filter-field',tr).value,
      operator:$('.filter-operator',tr).value,
      value:$('.filter-value',tr)?.value||'',
      value2:$('.filter-value2',tr)?.value||''
    }));
    return {conditions};
  }

  function refreshExpression(){
    $('#filterExpression').textContent=entryFilterExpression(readDefinition());
  }

  function addCondition(c={logic:'AND',field:'description',operator:'contains',value:'',value2:''}){
    const tr=document.createElement('tr');
    const index=tbody.children.length;
    tr.innerHTML=`
      <td>
        <select class="filter-logic" ${index===0?'disabled':''}>
          <option value="AND" ${(c.logic||'AND')==='AND'?'selected':''}>E</option>
          <option value="OR" ${(c.logic||'AND')==='OR'?'selected':''}>OU</option>
        </select>
      </td>
      <td><select class="filter-field">${filterFieldOptions(c.field)}</select></td>
      <td><select class="filter-operator">${filterOperatorOptions(c.field,c.operator)}</select></td>
      <td class="filter-value-cell">${filterValueControl(c.field,c.operator,c.value,c.value2)}</td>
      <td><button type="button" class="remove-line filter-remove">×</button></td>`;
    tbody.appendChild(tr);

    const field=$('.filter-field',tr),operator=$('.filter-operator',tr);

    field.onchange=()=>{
      const type=ENTRY_FILTER_FIELDS[field.value]?.type||'text';
      const first=(ENTRY_FILTER_OPERATORS[type]||ENTRY_FILTER_OPERATORS.text)[0][0];
      operator.innerHTML=filterOperatorOptions(field.value,first);
      $('.filter-value-cell',tr).innerHTML=filterValueControl(field.value,first,'','');
      refreshExpression();
    };

    operator.onchange=()=>{
      $('.filter-value-cell',tr).innerHTML=filterValueControl(field.value,operator.value,'','');
      refreshExpression();
    };

    tr.addEventListener('input',refreshExpression);
    tr.addEventListener('change',refreshExpression);

    $('.filter-remove',tr).onclick=()=>{
      tr.remove();
      if(!tbody.children.length)addCondition();
      [...tbody.children].forEach((r,i)=>{
        const logic=$('.filter-logic',r);
        logic.disabled=i===0;
        if(i===0)logic.value='AND';
      });
      refreshExpression();
    };
  }

  initial.forEach(addCondition);
  refreshExpression();

  $('#addFilterCondition').onclick=()=>{addCondition();refreshExpression()};

  $('#clearEntryFilter').onclick=()=>{
    S.entryFilter=null;
    closeModal();
    renderEntries();
  };

  $('#applyEntryFilter').onclick=()=>{
    const definition=readDefinition();
    S.entryFilter={
      id:null,
      name:$('#filterName').value.trim()||'Filtro atual',
      is_default:false,
      definition
    };
    closeModal();
    renderEntries();
  };

  $('#saveEntryFilter').onclick=async()=>{
    const name=$('#filterName').value.trim();
    if(!name)return toast('Informe um nome para salvar o filtro.','error');

    try{
      const d=await api('/api/journal-entry-filters',{
        method:'POST',
        body:{
          view_key:'journal_entries',
          name,
          definition:readDefinition(),
          is_default:$('#filterDefault').checked
        }
      });

      S.cache.entryFilters=null;
      S.entryFilter=d.filter;
      closeModal();
      toast('Filtro salvo.');
      renderEntries();
    }catch(x){toast(x.message,'error')}
  };

  if($('#deleteSavedFilter'))$('#deleteSavedFilter').onclick=async()=>{
    try{
      await api(`/api/journal-entry-filters/${active.id}`,{method:'DELETE'});
      S.cache.entryFilters=null;
      S.entryFilter=null;
      closeModal();
      toast('Filtro excluído.');
      renderEntries();
    }catch(x){toast(x.message,'error')}
  };
}

async function renderEntries(){
  const saved=await entryFilters();

  if(S.entryFilterCompany!==S.companyId){
    S.entryFilterCompany=S.companyId;
    S.entryFilter=saved.find(x=>x.is_default)||null;
  }else if(S.entryFilter?.id){
    S.entryFilter=saved.find(x=>x.id===S.entryFilter.id)||S.entryFilter;
  }

  const definition=currentEntryFilterDefinition();
  const filterParam=definition.conditions?.length?`&filter=${encodeURIComponent(JSON.stringify(definition))}`:'';
  const d=await api(`/api/journal-entries?limit=1000${filterParam}`);
  const a=d.entries||[];
  const create=can('accounting.entry.create'),edit=can('accounting.entry.edit'),del=can('accounting.entry.delete');

  tablePage({
    newLabel:create?'Novo lançamento':null,
    onNew:create?()=>entryForm():null,
    cols:['Data','Lote','Documento','Descrição','Débito','Crédito','Situação','Oficial','Ações'],
    rows:a.length?a.map(x=>`<tr>
      <td>${dateBR(x.entry_date)}</td>

      <td>${esc(x.document_number||'')}</td>

      <td>${money(x.total_debit)}</td>
      <td>${money(x.total_credit)}</td>
      <td>${badge(x.status)}</td>

      <td><div class="actions">
        <button class="btn secondary sm" data-open="${x.id}">Abrir</button>
        ${create?`<button class="btn secondary sm" data-duplicate-entry="${x.id}">Duplicar</button>`:''}
        ${x.status==='POSTED'&&x.official_status!=='INTEGRATED'&&edit?`<button class="btn secondary sm" data-edit-entry="${x.id}">Editar</button>`:''}
        ${x.status==='POSTED'&&x.official_status!=='INTEGRATED'&&del?`<button class="btn danger sm" data-delete-entry="${x.id}">Excluir</button>`:''}
      </div></td>
    </tr>`).join(''):null,
    emptyTitle:'Nenhum lançamento',
    emptyText:definition.conditions?.length?'Nenhum lançamento atende ao filtro aplicado.':(create?'Inclua o primeiro lançamento contábil.':'Nenhum lançamento disponível para consulta.')
  });

  const toolbar=$('.toolbar');
  const filterCount=definition.conditions?.length||0;
  const savedOptions=saved.map(x=>`<option value="${x.id}" ${S.entryFilter?.id===x.id?'selected':''}>${esc(x.name)}${x.is_default?' • padrão':''}</option>`).join('');

  toolbar.insertAdjacentHTML('afterbegin',`
    <button id="entryAutoFilterBtn" class="btn secondary">${filterCount?`Autofiltro (${filterCount})`:'Autofiltro'}</button>
    <select id="savedEntryFilter" style="max-width:220px">
      <option value="">Todos / filtro atual</option>
      ${savedOptions}
    </select>
    ${filterCount?'<button id="clearEntryFilterToolbar" class="btn secondary">Limpar filtro</button>':''}
  `);

  $('#entryAutoFilterBtn').onclick=openEntryAutoFilter;

  $('#savedEntryFilter').onchange=e=>{
    const f=saved.find(x=>x.id===e.target.value);
    S.entryFilter=f||null;
    renderEntries();
  };

  if($('#clearEntryFilterToolbar'))$('#clearEntryFilterToolbar').onclick=()=>{
    S.entryFilter=null;
    renderEntries();
  };

  $$('[data-open]').forEach(b=>b.onclick=()=>entryView(b.dataset.open));
  $$('[data-duplicate-entry]').forEach(b=>b.onclick=()=>entryForm(null,b.dataset.duplicateEntry));
  $$('[data-edit-entry]').forEach(b=>b.onclick=()=>entryForm(b.dataset.editEntry));
  $$('[data-delete-entry]').forEach(b=>b.onclick=()=>deleteEntryModal(b.dataset.deleteEntry));
}
async function entryForm(editId=null,duplicateId=null){

    }catch(x){
      return toast(x.message,'error');
    }

  if(editId){
    try{
      item=(await api(`/api/journal-entries/${editId}`)).entry;
    }catch(x){
      return toast(x.message,'error');

    const option=hist.options[hist.selectedIndex];
    const required=option?.dataset?.required==='1';
    comp.required=required;
    comp.placeholder=required?'Obrigatório':'Opcional';
    if(required)comp.setAttribute('aria-label','Complemento obrigatório');
    else comp.removeAttribute('aria-label');
  }

  function num(v){
    const n=Number(String(v||'').replace(/\./g,'').replace(',','.'));
    return Number.isFinite(n)?n:0;
  }

  function totals(){
    let d=0,c=0;
    $$('#lineBody tr').forEach(r=>{
      const v=num($('.amt',r).value);
      $('.side',r).value==='D'?d+=v:c+=v;
    });
    $('#totD').textContent=money(d);
    $('#totC').textContent=money(c);
    const ok=d>0&&Math.abs(d-c)<.005;
    $('#bal').className=ok?'balance-ok':'balance-bad';
    $('#bal').innerHTML=ok?'<b>Fechado</b>':'<b>Não fecha</b>';
  }

  if(seed?.lines?.length){
    seed.lines.forEach(l=>appendRow(l,l.side));
  }else{
    appendRow(null,'D');
    appendRow(null,'C');
  }

  totals();

  body.addEventListener('change',e=>{
    if(e.target.classList.contains('hist'))updateHistoryRequirement(e.target.closest('tr'));
  });

  body.addEventListener('input',totals);

  body.addEventListener('click',e=>{
    if(e.target.classList.contains('remove-line')){
      if(body.children.length<=2)return toast('Mantenha pelo menos duas linhas.','error');
      e.target.closest('tr').remove();
      totals();
    }
  });

  $('#addLine').onclick=()=>appendRow(null,'D');

  $('#entryForm').onsubmit=async e=>{
    e.preventDefault();

    let missingComplement=false;

    const lines=$$('#lineBody tr').map(r=>{
      updateHistoryRequirement(r);

      const hist=$('.hist',r);
      const option=hist.options[hist.selectedIndex];
      const required=option?.dataset?.required==='1';
      const complement=$('.comp',r).value.trim();

      if(required&&!complement){
        $('.comp',r).style.borderColor='#dc2626';
        missingComplement=true;
      }else{
        $('.comp',r).style.borderColor='';
      }

      return {
        side:$('.side',r).value,
        account_id:$('.acct',r).value,
        amount:$('.amt',r).value,
        cost_center_id:$('.cc',r).value||null,
        history_template_id:hist.value||null,
        history_complement:complement||null,
        allocations:r._allocations||[]
      };
    });

    if(missingComplement){
      toast('Preencha o complemento obrigatório do histórico.','error');
      return;
    }

    const f=new FormData(e.target);
    const payload={
      ...Object.fromEntries(f),
      branch_id:f.get('branch_id')||null,
      lines
    };

    try{
      await api(item?`/api/journal-entries/${item.id}`:'/api/journal-entries',{
        method:item?'PATCH':'POST',
        body:payload
      });

      closeModal();
      toast(item?'Lançamento atualizado.':(duplicateSource?'Lançamento duplicado e contabilizado.':'Lançamento contabilizado com sucesso.'));
      renderEntries();
    }catch(x){
      toast(x.message,'error');
    }
  };
}

}

async function deleteEntryModal(id){
  try{
    const e=(await api(`/api/journal-entries/${id}`)).entry;

    if(e.official_status==='INTEGRATED'){
      return toast('Desfaça a integração com o Lote 0 antes de excluir.','error');
    }

    openModal(
      'Excluir lançamento',
      'Esta ação remove o lançamento da movimentação contábil. A exclusão continuará registrada na auditoria do SAGAS.',
      `<div style="padding:8px 0">
        <div style="padding:12px;border:1px solid var(--line);border-radius:8px;background:#f8fafc">
          <div><b>${dateBR(e.entry_date)} • ${esc(e.document_number||'Sem documento')}</b></div>
          <div style="margin-top:6px">${esc(e.description||'')}</div>
          <div style="margin-top:8px;color:var(--muted)">Débito: ${money(e.total_debit)} • Crédito: ${money(e.total_credit)}</div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn secondary" data-close>Cancelar</button>
          <button type="button" id="confirmDeleteEntry" class="btn danger">Excluir lançamento</button>
        </div>
      </div>`
    );

    $('[data-close]').onclick=closeModal;

    $('#confirmDeleteEntry').onclick=async()=>{
      try{
        await api(`/api/journal-entries/${id}`,{method:'DELETE'});
        closeModal();
        toast('Lançamento excluído.');
        renderEntries();
      }catch(x){toast(x.message,'error')}
    };
  }catch(x){toast(x.message,'error')}
}

    <div class="grid">
      <label class="field"><span>Nome</span><input name="name" value="${esc(S.user?.name||'')}" required></label>

function changePassword(){
  openModal('Alterar senha','Troque sua senha de acesso ao SAGAS.',`
    <form id="changePasswordForm" class="stack">
      <label class="field">
        <span>Senha atual</span>
        <input name="current_password" type="password" autocomplete="current-password" required>
      </label>
      <label class="field">
        <span>Nova senha</span>
        <input name="new_password" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label class="field">
        <span>Confirmar nova senha</span>
        <input name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <div class="help">Use pelo menos 8 caracteres e uma senha diferente da atual.</div>
      <div class="form-actions">
        <button type="button" class="btn secondary" data-close>Cancelar</button>
        <button class="btn primary">Alterar senha</button>
      </div>
    </form>
  `);

  $('[data-close]').onclick=closeModal;

  $('#changePasswordForm').onsubmit=async e=>{
    e.preventDefault();
    const f=new FormData(e.target);
    const current_password=String(f.get('current_password')||'');
    const new_password=String(f.get('new_password')||'');
    const confirm_password=String(f.get('confirm_password')||'');

    if(new_password!==confirm_password){
      toast('A confirmação da nova senha não confere.','error');
      return;
    }

    try{
      await api('/api/auth/change-password',{
        method:'POST',
        company:false,
        body:{current_password,new_password}
      });
      closeModal();
      toast('Senha alterada com sucesso.');
    }catch(x){
      toast(x.message,'error');
    }
  };
}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkSessionAccess()});
